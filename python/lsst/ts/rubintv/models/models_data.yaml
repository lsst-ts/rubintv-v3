  - name: summit
    title: Summit
    profile_name: summit-data-summit
    bucket_name: rubintv
    logo: Summit.jpg
    text_colour: "#fff"
    text_shadow: true
    has_cluster_status: true
    camera_groups:
      Simonyi Telescope: [lsstcam, lsstcam_aos, lsstcam_guider, tma]
      Environment and Performance: [auxtel, allsky, dream, ra_performance]
      Previously Used Channels:
