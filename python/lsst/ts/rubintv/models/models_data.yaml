# RubinTV configuration: locations, cameras, channels, services.
#
# The loader (rubintv/config/loader.py) validates this into typed models at
# startup. A location's camera_groups must reference cameras defined below;
# an unknown reference is a startup error.
#
# bucket_configurations maps each *site* (deployment shape) to the locations
# it can see. The loader filters by RAPID_ANALYSIS_LOCATION so a pod only ever holds
# clients for buckets it can actually reach. Each location declares its own
# bucket, AWS profile, and endpoint.
#
# The `local` site mirrors the `usdf-k8s` topology — when running on a laptop
# via SSH tunnels to the USDF embargo gateway, the same four locations are
# visible. `gha` is the GitHub-Actions CI shape (also USDF-style).

bucket_configurations:
  usdf-k8s: [summit-usdf, usdf, base-usdf, tucson-usdf]
  base: [base]
  tucson: [tucson]
  summit: [summit]
  gha: [summit-usdf, usdf, base-usdf, tucson-usdf]
  local: [summit-usdf, usdf, base-usdf, tucson-usdf]
  # `test` is the lightweight shape used by the integration test suite.
  test: [test]

locations:
  - name: test
    title: TEST
    bucket_name: rubintv-local
    # No profile/endpoint: tests run under moto, which intercepts the default
    # AWS endpoint. Setting an explicit profile/endpoint here would require
    # the test environment to have credentials/DNS for the real one.
    camera_groups:
      Main: [lsstcam, auxtel]
      Auxiliary: [allsky]

  - name: usdf
    title: USDF
    profile_name: rubin-rubintv-data-usdf-embargo
    bucket_name: rubin-rubintv-data-usdf
    endpoint_url: https://sdfembs3.sdf.slac.stanford.edu
    logo: SLAC_Logo.svg
    has_cluster_status: true
    camera_groups:
      Nightly Validation: [lsstcam, lsstcam_aos, lsstcam_guider, ra_performance]

  - name: base-usdf
    title: Base
    is_teststand: true
    profile_name: rubin-rubintv-data-bts
    bucket_name: rubin-rubintv-data-bts
    endpoint_url: https://s3dfrgw.slac.stanford.edu
    logo: bts_720.jpg
    text_colour: "#fff"
    text_shadow: true
    services: [auxtel, tma]
    camera_groups:
      Telescope Mounted:
        [auxtel, lsstcam, lsstcam_aos, lsstcam_guider, ra_performance]
      Cameras: [fake_auxtel]
      Telescopes: [tma]

  - name: tucson-usdf
    title: Tucson
    is_teststand: true
    profile_name: rubin-rubintv-data-tts
    bucket_name: rubin-rubintv-data-tts
    endpoint_url: https://s3dfrgw.slac.stanford.edu
    logo: cactus.svg
    camera_groups:
      Telescope Mounted: [auxtel]
      Cameras: [fake_auxtel, comcam, comcam_aos]
      Telescopes: [tma]

  - name: summit-usdf
    title: Summit
    profile_name: rubin-rubintv-data-summit-embargo
    bucket_name: rubin-rubintv-data-summit
    endpoint_url: https://sdfembs3.sdf.slac.stanford.edu
    logo: Summit.jpg
    text_colour: "#fff"
    text_shadow: true
    camera_groups:
      Simonyi Telescope: [lsstcam, lsstcam_aos, lsstcam_guider, tma]
      Environment and Performance: [auxtel, allsky, dream, ra_performance]

  - name: base
    title: Base
    profile_name: base-data-base
    bucket_name: rubintv
    logo: bts_720.jpg
    text_colour: "#fff"
    text_shadow: true
    has_cluster_status: true
    camera_groups:
      Telescope Mounted:
        [auxtel, lsstcam, lsstcam_aos, lsstcam_guider, ra_performance]
      Cameras: [fake_auxtel]
      Telescopes: [tma]

  - name: tucson
    title: Tucson
    profile_name: tucson-data-tucson
    bucket_name: rubintv
    logo: cactus.svg
    camera_groups:
      Cameras: [auxtel, fake_auxtel, comcam, comcam_aos]
