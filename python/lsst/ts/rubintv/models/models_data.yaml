      auxtel_metadata: Metadata
      auxtel_isr_runner: ISR Runner

  startracker_narrow:
    display_name: StarTracker Narrow
    channels: startracker_narrow
    services:
      startracker_narrow_metadata: Metadata

  allsky:
    display_name: All Sky
    services:
      allsky: All Sky

  comcam:
    display_name: ComCam
    channels: comcam

  tma:
    channels: tma

  background:
    display_name: Background Services
    services:
      backgroundService: Background

metadata_columns:
  fake_auxtel:
    Exposure log entries: Any exposure log entries which have been made, click to pop out the details
    Mount motion image degradation: An estimate of the degradation of the PSF, in arcseconds, due mount tracking issues
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc
    Target: The name of the target in the exposure
    Filter: The filter in use for the image, or `empty` if none
    Disperser: The dispersive element in use for the image, or `empty` if none
    Airmass: The airmass of the observation
    TAI: The TAI of the observation
    DIMM Seeing: The seeing, as measured by the DIMM, if available

  lsstcam:
    Retrieval fails: Whether retrieval of raw data for this image failed or not
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc

  lsstcam_aos:
    Retrieval fails: Whether retrieval of raw data for this image failed or not
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc

  lsstcam_guider:
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc

  auxtel:
    Exposure log entries: Any exposure log entries which have been made, click to pop out the details
    Mount motion image degradation: An estimate of the degradation of the PSF, in arcseconds, due mount tracking issues
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc
    Target: The name of the target in the exposure
    Filter: The filter in use for the image, or `empty` if none
    Disperser: The dispersive element in use for the image, or `empty` if none
    Airmass: The airmass of the observation
    TAI: The TAI of the observation
    DIMM Seeing: The seeing, as measured by the DIMM, if available

  startracker_narrow:
    Exposure Time narrow: The image exposure time
    MJD narrow: The MJD of the observation
    Ra narrow: The commanded ra from the header
    Dec narrow: The commanded dec from the header
    Alt narrow: The average alt from the header
    Az narrow: The average az from the header
    nSources narrow: The total number of sources detected in the image
    nSources filtered narrow: The total number of sources passed to the fitter
    Calculated Ra narrow: The calculated ra from the astrometric fit
    Calculated Dec narrow: The calculated dec from the astrometric fit
    Delta Ra Arcsec narrow: The difference between the commanded and fitted ra, in arcseconds
    Delta Dec Arcsec narrow: The difference between the commanded and fitted dec, in arcseconds
    RMS scatter arcsec narrow: The RMS distance between the measured position of each source and its position in the catalog, in arcseconds

  comcam:
    Exposure time: The image exposure time
    Dark time: The image dark time
    Image type: The image type, e.g. bias, dark, flat etc
    Test type: The type of test being run, e.g. superflats etc

  comcam_sim_aos:
    Exposure time: The image exposure time

  comcam_aos:
    Exposure time: The image exposure time

  comcam_sim:
    Exposure time: The image exposure time

  tma:
    Event version number: The code version which generated the event. Events only necessarily have the same timespans when their version numbers match!
    Event type: The type of event, i.e. was it a regular move (MOVING) or were we tracking the sky (TRACKING)?
    End reason: Why did the event end? Did we turn off, stop, go to fault, or change movement type?
    Duration: The duration of the event, in seconds.
    Time UTC: The start time of the event, as a UTC time string.
    Elevation start: The starting elevation value, in degrees.
    Elevation move: The total net elevation move, in degrees.
    Largest elevation torque: The largest elevation torque during the event, in Nm, including its sign.
    Azimuth start: The starting azimuth value, in degrees.
    Azimuth move: The total net azimuth move, in degrees.
    Largest azimuth torque: The largest azimuth torque during the event, in Nm, including its sign.

  ra_performance:
    Exposure time: The image exposure time
    Image type: The image type, e.g. bias, dark, flat etc

  dream: {}

# Columns that are always shown when present and can't be hidden in the column
# picker (they appear there ghosted/locked). Keyed by camera name, same as
# metadata_columns; inherited along metadata_from.
locked_columns:
  lsstcam: [Retrieval fails]
  lsstcam_aos: [Retrieval fails]

