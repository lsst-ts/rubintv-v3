name: CI

on:
  push:
    # Deployable refs (everything but main) also trigger the image build
    # below, matching the original rubintv repo's convention: ticket
    # branches, deploy branches, develop, and release tags.
    branches: ["main", "tickets/**", "deploy**", "develop"]
    tags: ["*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync deps
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy rubintv
      - name: pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # Build + push the container image for deployable refs: ticket branches,
  # deploy branches, develop, and release tags — the same gating as the
  # original rubintv repo. The SPA is built inside the Dockerfile (stage 1),
  # so no npm step is needed here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    if: >
      github.event_name == 'push'
      && (startsWith(github.ref, 'refs/tags/')
          || startsWith(github.ref, 'refs/heads/tickets/')
          || startsWith(github.ref, 'refs/heads/deploy')
          || startsWith(github.ref, 'refs/heads/develop'))

    steps:
      - uses: actions/checkout@v5

      - name: Define the Docker tag and build provenance
        id: vars
        run: |
          echo "tag=$(scripts/docker-tag.sh)" >> $GITHUB_OUTPUT
          echo "git_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "git_date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)" \
            >> $GITHUB_OUTPUT

      - name: Print the tag
        run: echo ${{ steps.vars.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.git_sha }}
            GIT_DATE=${{ steps.vars.outputs.git_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
