function Table({ headerStyle, density, channelColumns, showAnnotations, filters, setFilters, hiddenCols }) {
  // Foldout state: which (rowIdx, colKey, anchor rect) cell is open. Null = closed.
  const [foldout, setFoldout] = useState(null);

  // Visible columns: respect both the channelColumns master toggle AND the
  // per-column hidden set from the column picker.
  const visibleCols = useMemo(() => {
    return COLS.filter((c) => {
      if (hiddenCols && hiddenCols.has(c.key)) return false;
      if (!channelColumns && CHANNEL_COLS.find((cc) => cc.key === c.key)) return false;
      return true;
    });
  }, [channelColumns, hiddenCols]);

  // Column widths (fixed, derived from data; not user-resizable per feedback)
  const widths = useMemo(() => {
    const o = {};
    COLS.forEach((c) => o[c.key] = widthFromData(c));
    return o;
  }, []);

  // density adjusts row height & font
  const rowPad = density === 'compact' ? '3px 8px' : density === 'comfy' ? '10px 10px' : '6px 8px';
  const fontSize = density === 'compact' ? 10 : density === 'comfy' ? 12 : 11;

  // Apply active filters: keep only row indices where every filter matches.
  // META_COLS sample arrays are positional by row.
  const matchOne = (cellVal, op, v) => {
    // Object-type ops are existence-only — the cell is either populated
    // or null/undefined. No value is meaningful for these.
    if (op === 'exists') return cellVal != null;
    if (op === '!exists') return cellVal == null;
    const s = String(cellVal ?? '');
    const target = String(v ?? '').trim();
    const sl = s.toLowerCase(),tl = target.toLowerCase();
    if (op === '=') return sl === tl;
    if (op === '!=') return sl !== tl;
    if (op === '~') return sl.includes(tl);
    if (op === 'starts') return sl.startsWith(tl);
    if (op === 'ends') return sl.endsWith(tl);
    if (op === 'in') {
      const parts = target.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
      return parts.includes(sl);
    }
    if (op === 'between') {
      const [lo, hi] = target.split(/\s*[,–\-]\s*/).map(parseFloat);
      const a = parseFloat(s);
      if ([a, lo, hi].some(Number.isNaN)) return false;
      return a >= Math.min(lo, hi) && a <= Math.max(lo, hi);
    }
    if (op === '>' || op === '<' || op === '>=' || op === '<=') {
      const a = parseFloat(s),b = parseFloat(target);
      if (Number.isNaN(a) || Number.isNaN(b)) return false;
      if (op === '>') return a > b;
      if (op === '<') return a < b;
      if (op === '>=') return a >= b;
      if (op === '<=') return a <= b;
    }
    return true;
  };
  const visibleRowIdx = useMemo(() => {
    const idx = SEQ_NUMS.map((_, i) => i);
    if (!filters || !filters.length) return idx;
    return idx.filter((i) =>
    filters.every((f) => {
      const col = META_COLS.find((c) => c.key === f.col);
      if (!col) return true;
      return matchOne(col.sample[i], f.op, f.value);
    })
    );
  }, [filters]);

  // Reset header style overrides for vertical/angled
  const headerExtraClass = `hs-${headerStyle}`;

  /* For angled mode: render labels as a SEPARATE overlay layer, positioning
     each label at the measured left-edge of its <th>. Lets labels extend
     rightward beyond their own column width — they're only truncated when
     their diagonal rise (L × sin45°) would exceed --header-h. */
  const wrapRef = useRef(null);
  const headRef = useRef(null);
  const overlayRef = useRef(null);
  const [colPositions, setColPositions] = useState([]);
  const [tableW, setTableW] = useState(0);

  useEffect(() => {
    if (headerStyle !== 'angled') return;
    const measure = () => {
      if (!headRef.current || !wrapRef.current) return;
      const ths = [...headRef.current.querySelectorAll('th')];
      const wrapRect = wrapRef.current.getBoundingClientRect();
      const sl = wrapRef.current.scrollLeft;
      const positions = ths.map((th) => {
        const r = th.getBoundingClientRect();
        // Position relative to the scroll-content origin so overlay scrolls
        // horizontally in lockstep with the table.
        return {
          left: r.left - wrapRect.left + sl,
          width: r.width
        };
      });
      setColPositions(positions);
      const tbl = wrapRef.current.querySelector('.data-table');
      if (tbl) setTableW(tbl.offsetWidth);
    };
    measure();
    const ro = new ResizeObserver(measure);
    if (headRef.current) ro.observe(headRef.current);
    if (wrapRef.current) ro.observe(wrapRef.current);
    window.addEventListener('resize', measure);
    return () => {ro.disconnect();window.removeEventListener('resize', measure);};
  }, [headerStyle, visibleCols, widths]);

  // Sticky-top is handled by native CSS (position: sticky on .header-overlay).
  // Nothing to wire up here.

  return (
    <>
    {filters && filters.length > 0 && visibleRowIdx.length < SEQ_NUMS.length &&
      <div className="filter-notice" role="status">
        <span className="icon">filtered</span>
        <span>
          <span className="count">{SEQ_NUMS.length - visibleRowIdx.length}</span>
          {' '}row{SEQ_NUMS.length - visibleRowIdx.length === 1 ? '' : 's'} hidden by{' '}
          <span className="count">{filters.length}</span>
          {' '}active filter{filters.length === 1 ? '' : 's'}
          {' · showing '}
          <span className="count">{visibleRowIdx.length}</span>
          {' of '}
          <span className="count">{SEQ_NUMS.length}</span>
        </span>
        <span className="spacer" />
        <span className="clear" onClick={() => setFilters && setFilters([])}>clear filters</span>
      </div>
      }
    <div className="table-wrap" ref={wrapRef} data-comment-anchor="c038cfa544-div-859-5">
      {headerStyle === 'angled' &&
        <div className="header-overlay" ref={overlayRef} style={{ width: tableW }}>
          <div className="header-overlay-bg" />
          {visibleCols.map((c, i) => {
            if (!colPositions[i]) return null;
            if (c.sticky) return null; // seq label is rendered in-place inside its sticky <th>
            const pos = colPositions[i];
            return (
              <div
                key={c.key}
                className="hdr-label"
                title={c.label}
                style={{ left: pos.left + 4 }}>
              
                {c.label}
              </div>);

          })}
        </div>
        }
      <table className={`data-table ${headerExtraClass}`} style={{ fontSize }}>
        <colgroup>
          {visibleCols.map((c) => <col key={c.key} style={{ width: widths[c.key] }} />)}
        </colgroup>
        <thead ref={headRef}>
          <tr>
            {visibleCols.map((c) =>
              <th
                key={c.key}
                className={c.sticky ? 'seq' : ''}
                style={{
                  width: widths[c.key],
                  '--label-w': widths[c.key] + 'px', height: "150px"
                }}
                title={!c.sticky ? c.label : undefined}>
              
                <span className="label">
                  {headerStyle === 'stacked' && !c.sticky ?
                  c.label.split(' ').map((w, i) => <span key={i}>{w}</span>) :
                  c.label}
                </span>
              </th>
              )}
          </tr>
        </thead>
        <tbody>
          {visibleRowIdx.map((ri, displayIdx) => {
              const s = SEQ_NUMS[ri];
              return (
                <tr key={s} className={displayIdx === 0 && !filters.length ? 'newest' : ri === 0 ? 'newest' : ''}>
              {visibleCols.map((c) => {
                    if (c.key === 'seq') {
                      return <td key="seq" className="seq" style={{ padding: rowPad }}>{s}</td>;
                    }
                    const channelCol = CHANNEL_COLS.find((cc) => cc.key === c.key);
                    if (channelCol) {
                      // chip
                      const isEmpty = (ri + c.key.length) % 7 === 3;
                      return (
                        <td key={c.key} style={{ padding: rowPad }}>
                      {!isEmpty &&
                          <span
                            className="cell-chip"
                            style={{ background: channelCol.color }} />

                          }
                    </td>);

                    }
                    const metaCol = META_COLS.find((mc) => mc.key === c.key);
                    const v = metaCol?.sample[ri];

                    // Object cells render as their DISPLAY_VALUE glyph (or a
                    // generic ▦ fallback) inside a button that opens the
                    // FoldoutCell. Null / undefined renders as em-dash.
                    if (metaCol?.type === 'object') {
                      const obj = v;
                      if (obj == null || typeof obj !== 'object') {
                        return <td key={c.key} className="obj-cell empty" style={{ padding: rowPad, textAlign: 'center' }}>—</td>;
                      }
                      const glyph = obj.DISPLAY_VALUE || '▦';
                      return (
                        <td key={c.key} className="obj-cell" style={{ padding: rowPad, textAlign: 'center' }}>
                        <button
                            type="button"
                            className="obj-glyph"
                            title={`${metaCol.label} — click to expand`}
                            onClick={(e) => {
                              const r = e.currentTarget.getBoundingClientRect();
                              setFoldout({ rowIdx: ri, colKey: c.key, anchor: { x: r.left, y: r.bottom } });
                            }}>
                          {glyph}
                        </button>
                      </td>);
                    }

                    // Number cells: per the loader, numbers are floats. Show
                    // a 2-decimal-place truncation in the cell, with the full
                    // value available via title-tooltip on hover. Non-numeric
                    // sentinels (em-dash, null) fall through unchanged.
                    let display = v ?? '';
                    let titleAttr;
                    if (metaCol?.type === 'number') {
                      const n = parseFloat(v);
                      if (!Number.isNaN(n) && v !== '' && v != null && String(v) !== '—') {
                        const full = String(v);
                        const trunc = (Math.trunc(n * 100) / 100).toFixed(2);
                        if (full !== trunc) titleAttr = full;
                        display = trunc;
                      }
                    }
                    return (
                      <td key={c.key} title={titleAttr} style={{
                        padding: rowPad,
                        color: display === '—' || display === '' ? 'var(--ink-soft)' : 'var(--ink)',
                        whiteSpace: 'nowrap',
                        overflow: 'hidden',
                        textOverflow: 'ellipsis',
                        cursor: titleAttr ? 'help' : undefined
                      }}>{display === '' ? '—' : display}</td>);

                  })}
            </tr>);
            })}
        </tbody>
      </table>
      {visibleRowIdx.length === 0 && filters && filters.length > 0 &&
        <div className="empty-state">
          <div className="glyph">⌕</div>
          <div className="title">No rows match the current filters</div>
          <div className="sub">
            {SEQ_NUMS.length} row{SEQ_NUMS.length === 1 ? '' : 's'} hidden by{' '}
            {filters.length} active filter{filters.length === 1 ? '' : 's'}.
          </div>
          <span className="clear-link" onClick={() => setFilters && setFilters([])}>clear all filters</span>
        </div>
        }
      {showAnnotations &&
        <div className="anno" style={{ position: 'absolute', right: 18, top: headerStyle === 'vertical' ? 140 : headerStyle === 'angled' ? 120 : 50, maxWidth: 220, pointerEvents: 'none' }}>
          ← column widths derive from<br />
          the longest value in each column.<br />
          long header names truncate.
        </div>
        }
      {foldout && (() => {
          const col = META_COLS.find((c) => c.key === foldout.colKey);
          const obj = col?.sample[foldout.rowIdx];
          if (!obj || typeof obj !== 'object') return null;
          const seq = SEQ_NUMS[foldout.rowIdx];
          return (
            <FoldoutCell
              col={col}
              obj={obj}
              seq={seq}
              anchor={foldout.anchor}
              onClose={() => setFoldout(null)} />);

        })()}
    </div>
    </>);

}

/* FoldoutCell — pops out near the clicked object cell to show its
   payload. Per <MetadataCell>/<FoldoutCell> in TableView.tsx, an object
   value can be either a flat list (all keys numeric → render as values
   only) or a list of key-value pairs (mixed/string keys → render with
   labels). The DISPLAY_VALUE key is consumed by the cell glyph itself
   and stripped from the fold-out body. */
function FoldoutCell({ col, obj, seq, anchor, onClose }) {
  // Close on outside-click / Escape.
  useEffect(() => {
    const onKey = (e) => {if (e.key === 'Escape') onClose();};
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  // Strip the DISPLAY_VALUE marker — it's the glyph, not data.
  const entries = Object.entries(obj).filter(([k]) => k !== 'DISPLAY_VALUE');
  const isList = entries.length > 0 && entries.every(([k]) => /^\d+$/.test(k));
  const glyph = obj.DISPLAY_VALUE || '▦';

  // Position: anchor below the clicked glyph, clamped into the viewport.
  // Measured after first render so we can flip up / left when needed.
  const ref = useRef(null);
  const [pos, setPos] = useState({ left: anchor.x, top: anchor.y + 4 });
  useEffect(() => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    let left = anchor.x;
    let top = anchor.y + 4;
    if (left + r.width > window.innerWidth - 10) left = window.innerWidth - r.width - 10;
    if (top + r.height > window.innerHeight - 10) top = Math.max(10, anchor.y - r.height - 24);
    setPos({ left, top });
  }, [anchor.x, anchor.y]);

  return (
    <>
      <div className="foldout-backdrop" onClick={onClose} />
      <div className="foldout" ref={ref} style={{ left: pos.left, top: pos.top }} onClick={(e) => e.stopPropagation()}>
        <div className="foldout-head">
          <span className="glyph">{glyph}</span>
          <span className="title">{col.label}</span>
          <span className="seq">seq {seq}</span>
          <button className="close" onClick={onClose} title="Close (Esc)" aria-label="Close">✕</button>
        </div>
        <div className={`foldout-body ${isList ? 'list' : ''}`}>
          {entries.length === 0 &&
          <div className="row"><span className="v" style={{ color: 'var(--ink-soft)', fontStyle: 'italic' }}>(no items)</span></div>
          }
          {entries.map(([k, val]) =>
          <div key={k} className="row">
              <span className="k">{isList ? k : k}</span>
              <span className="v">{String(val)}</span>
            </div>
          )}
        </div>
        <div className="foldout-foot">
          {isList ? `${entries.length} items` : `${entries.length} key/value pairs`}
        </div>
      </div>
    </>);

}

/* ---------- Interactive filter control ----------
   Lives in the controls bar. Renders the [ filter · N ▾ ] button only;
   the active filter chips themselves live in <FilterBar> below the
   controls row so they wrap freely without distorting the controls row.

   The popover hosts:
     • a fuzzy column combobox (the column count is large — a <select>
       would be unusable; users type a few chars to narrow)
     • a type-aware operator picker (operators come from OPS_BY_TYPE for
       the chosen column's data type)
     • a value input + suggestion chips drawn from the column's data */
function FilterControl({ filters, setFilters }) {
  const [open, setOpen] = useState(false);
  const [draftCol, setDraftCol] = useState(() => META_COLS[0]?.key || 'imgtype');
  const [draftOp, setDraftOp] = useState('=');
  const [draftVal, setDraftVal] = useState('');
  const rootRef = useRef(null);

  const draftColDef = useMemo(
    () => META_COLS.find((c) => c.key === draftCol),
    [draftCol]
  );
  const draftType = draftColDef?.type || 'string';
  const availableOps = OPS_BY_TYPE[draftType] || OPS_BY_TYPE.string;

  // If the current op isn't valid for the new column's type, snap to the
  // first valid op for that type.
  useEffect(() => {
    if (!availableOps.some(([op]) => op === draftOp)) {
      setDraftOp(availableOps[0][0]);
    }
  }, [draftType]); // eslint-disable-line

  // Suggestions: unique values from the column's sample data, minus em-dashes.
  const suggestions = useMemo(() => {
    if (!draftColDef) return [];
    return [...new Set(draftColDef.sample.filter((v) => v && v !== '—'))].slice(0, 8);
  }, [draftColDef]);

  const valueless = draftOp === 'exists' || draftOp === '!exists';

    return 'value';

  return (
    <span className="filter-cluster" ref={rootRef}>

        className={`filter-btn ${filters.length ? 'active' : ''}`}

          </div>
          <div className="col-row" style={{ marginTop: -2 }}>
            <label>&nbsp;</label>
            <span className="type-tag" style={{ marginLeft: 0 }} data-comment-anchor="b75d469975-span-530-13">{draftType}</span>
          </div>
          <div className="row">
            <label>op</label>
            <select className="op" value={draftOp} onChange={(e) => setDraftOp(e.target.value)}
          data-comment-anchor="93b8741de3-select-419-13"
          style={{ flex: '0 0 110px' }}>
              {availableOps.map(([op, lbl]) => <option key={op} value={op}>{lbl}</option>)}
            </select>
            <input
            placeholder={valueless ? '(no value needed)' : valuePlaceholder}
            value={valueless ? '' : draftVal}

            onChange={(e) => setDraftVal(e.target.value)}

          {suggestions.length > 0 && draftOp !== 'between' && !valueless &&
        <>
              <div className="hint">common values:</div>

/* Fuzzy column combobox. Substring + subsequence match against the
   column label. Arrow keys navigate; Enter selects. The label is what
   the user sees, but the stored value is the column's stable `key`. */
function ColumnCombo({ value, onChange }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const [kbdIdx, setKbdIdx] = useState(0);
  const inputRef = useRef(null);
  const rootRef = useRef(null);

  const current = META_COLS.find((c) => c.key === value);
  const display = open ? query : current?.label || '';

  // Fuzzy match: prefer substring, fall back to subsequence.
  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return META_COLS.map((c) => ({ col: c, score: 0, hl: null }));
    const scored = [];
    for (const c of META_COLS) {
      const lbl = c.label.toLowerCase();
      const key = c.key.toLowerCase();
      const subIdx = lbl.indexOf(q);
      if (subIdx !== -1) {
        scored.push({
          col: c,
          score: subIdx === 0 ? -1000 : -500 + subIdx,
          hl: { kind: 'range', a: subIdx, b: subIdx + q.length }
        });
        continue;
      }
      // subsequence in label or key
      const sub = subseq(lbl, q) ?? subseq(key, q);
      if (sub) scored.push({
        col: c,
        score: sub.score,
        hl: { kind: 'seq', idx: sub.spansInLabel }
      });
    }
    scored.sort((a, b) => a.score - b.score);
    return scored;
  }, [query]);

  useEffect(() => {setKbdIdx(0);}, [query]);

  // Click outside to close.
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (rootRef.current && !rootRef.current.contains(e.target)) {
        setOpen(false);
        setQuery('');
      }
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [open]);

  const pick = (col) => {onChange(col.key);setOpen(false);setQuery('');};

  const onKey = (e) => {
    if (e.key === 'ArrowDown') {e.preventDefault();setKbdIdx((i) => Math.min(matches.length - 1, i + 1));} else
    if (e.key === 'ArrowUp') {e.preventDefault();setKbdIdx((i) => Math.max(0, i - 1));} else
    if (e.key === 'Enter' && matches[kbdIdx]) {e.preventDefault();pick(matches[kbdIdx].col);} else
    if (e.key === 'Escape') {setOpen(false);setQuery('');}
  };

  return (
    <span className="filter-combo" ref={rootRef} data-comment-anchor="b8a4bed171-select-411-13">
      <input
        ref={inputRef}
        value={display}
        placeholder="search columns…"
        onFocus={() => {setOpen(true);setQuery('');}}
        onChange={(e) => {setQuery(e.target.value);setOpen(true);}}
        onKeyDown={onKey} />
      
      {open &&
      <div className="list" onMouseDown={(e) => e.preventDefault() /* keep focus */}>
          <div className="count">
            {matches.length} of {META_COLS.length} columns
          </div>
          {matches.length === 0 &&
        <div className="empty">no columns match “{query}”</div>
        }
          {matches.map((m, i) =>
        <div
          key={m.col.key}
          className={`item ${i === kbdIdx ? 'kbd-active' : ''}`}
          onMouseEnter={() => setKbdIdx(i)}
          onClick={() => pick(m.col)}>
              <span className="name">{highlight(m.col.label, m.hl)}</span>
              <span className="type-pill">{m.col.type}</span>
            </div>
        )}
        </div>
      }
    </span>);

}

// Subsequence match: returns {score, spansInLabel} or null. Score is
// negative so it sorts after substring hits.
function subseq(hay, needle) {
  let i = 0,j = 0;
  const spans = [];
  while (i < hay.length && j < needle.length) {
    if (hay[i] === needle[j]) {
      spans.push(i);
      j++;
    }
    i++;
  }
  if (j < needle.length) return null;
  // Score: prefer tighter runs (lower span between first/last char).
  const spread = spans[spans.length - 1] - spans[0];
  return { score: spread, spansInLabel: spans };
}

// Wrap matched span(s) of the label in <mark>. hl is either
// {kind:'range', a, b} for substring hits, or {kind:'seq', idx:[...]} for
// subsequence hits.
function highlight(label, hl) {
  if (!hl) return label;
  if (hl.kind === 'range') {
    const { a, b } = hl;
    return <>{label.slice(0, a)}<mark>{label.slice(a, b)}</mark>{label.slice(b)}</>;
  }
  // subsequence
  const parts = [];
  let last = 0;
  for (const i of hl.idx) {
    parts.push(label.slice(last, i));
    parts.push(<mark key={'m' + i}>{label[i]}</mark>);
    last = i + 1;
  }
  parts.push(label.slice(last));
  return <>{parts}</>;
}

/* ---------- Interactive column picker ----------
   A wide popover anchored to the [⚙ columns N/M ▾] button. Lists every
   metadata column in a multi-column grid with a live search at the top.
   No horizontal scroll — the grid auto-wraps.

   Scope: METADATA columns only. Channels are always shown (they're not
   part of the per-row metadata payload). Seq.No is structural and
   always shown.

   The metadata schema is dynamic — keys can change from one seq num to
   the next — so columns are presented as a flat alphabetical list. No
   client-side grouping is invented; the union of keys observed in the
   day's rows is what shows up here.

   Bulk actions: "all", "none", "reset" (back to defaults). */
function ColumnPicker({ hiddenCols, setHiddenCols }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const rootRef = useRef(null);
  const popRef = useRef(null);

  // Clamp the popover into the viewport. The button can sit deep in the
  // controls row, so its natural left-anchor often runs the popover off
  // the right edge of the screen. Measure post-render, then shift left
  // by the overflow amount so the popover's right edge always sits
  // inside the viewport.
  useEffect(() => {
    if (!open || !popRef.current) return;
    const pop = popRef.current;
    pop.style.left = '0px';
    const rect = pop.getBoundingClientRect();
    const overflow = rect.right - (window.innerWidth - 12);
    if (overflow > 0) pop.style.left = `${-overflow}px`;
  }, [open, query, hiddenCols]);

  // The picker lists metadata columns only. Channels are always shown;
  // Seq.No is structural and always shown.
  const allTogglable = useMemo(
    () => [...META_COLS].sort((a, b) => a.label.localeCompare(b.label)),
    []
  );
  const total = allTogglable.length;
  const visibleCount = allTogglable.filter((c) => !hiddenCols.has(c.key)).length;

  // Filter by query — substring against label or key, case-insensitive.
  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return allTogglable;
    return allTogglable.filter((c) =>
    c.label.toLowerCase().includes(q) || c.key.toLowerCase().includes(q)
    );
  }, [query, allTogglable]);

  // Click outside / Escape to close.
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
    };
    const onKey = (e) => {if (e.key === 'Escape') setOpen(false);};
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  const toggle = (key) => {
    const next = new Set(hiddenCols);
    if (next.has(key)) next.delete(key);else next.add(key);
    setHiddenCols(next);
  };
  const showAll = () => {
    // Only un-hide metadata columns — leave any channel-related state alone.
    const next = new Set(hiddenCols);
    for (const c of META_COLS) next.delete(c.key);
    setHiddenCols(next);
  };
  const hideAll = () => {
    const next = new Set(hiddenCols);
    for (const c of META_COLS) next.add(c.key);
    setHiddenCols(next);
  };
  const reset = () => {
    const next = new Set();
    for (const c of META_COLS) if (!DEFAULT_VISIBLE.has(c.key)) next.add(c.key);
    setHiddenCols(next);
  };

  const q = query.trim().toLowerCase();

  return (
    <span className="cols-cluster" ref={rootRef}>
      <button
        className={`cols-btn ${hiddenCols.size > 0 ? 'active' : ''}`}
        onClick={() => setOpen((v) => !v)}
        title="Add / remove metadata columns">
        <ColumnsIcon /><span>columns</span>
        <span className="frac">{visibleCount}/{total}</span>
        <ChevronDownIcon />
      </button>

      {open &&
      <div className="picker-pop" ref={popRef} onClick={(e) => e.stopPropagation()}>
          <div className="picker-head">
            <span className="title">metadata columns</span>
            <span className="count"><b>{visibleCount}</b> of {total} shown</span>
            <input
            className="search"
            placeholder="search columns…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            autoFocus />
            <div className="bulk">
              <button onClick={showAll} title="Show all metadata columns">all</button>
              <button onClick={hideAll} title="Hide all metadata columns">none</button>
              <button onClick={reset} title="Restore default column set">reset</button>
            </div>
          </div>
          <div className="picker-body">
            {matches.length === 0 ?
          <div style={{ padding: 20, textAlign: 'center', fontFamily: 'var(--hand)', color: 'var(--ink-soft)', fontStyle: 'italic' }}>
                no columns match “{query}”
              </div> :

          <div className="picker-grid">
                {matches.map((c) =>
            <label key={c.key} className={`picker-item ${hiddenCols.has(c.key) ? 'dim' : ''}`}>
                    <input
                type="checkbox"
                checked={!hiddenCols.has(c.key)}
                onChange={() => toggle(c.key)} />
                    <span className="label-text">{highlightLabel(c.label, q)}</span>
                  </label>
            )}
              </div>
          }
          </div>
          <div className="picker-foot">
            <span>Channels and Seq.No are always shown.</span>
            <span className="spacer" />
            <span>{[...hiddenCols].filter((k) => META_COLS.some((c) => c.key === k)).length} hidden</span>
          </div>
        </div>
      }
    </span>);

}

function highlightLabel(label, q) {
  if (!q) return label;
  const idx = label.toLowerCase().indexOf(q);
  if (idx === -1) return label;
  return <>{label.slice(0, idx)}<mark>{label.slice(idx, idx + q.length)}</mark>{label.slice(idx + q.length)}</>;
}

};

// getTabs(): text tabs first (in order), then one tab per plot group.
function nrGetTabs(report) {
  const tabs = [];
  (report.text || []).forEach((item) => {
    tabs.push({ id: nrSanitise(item.title), label: item.title, type: 'text', kind: item.type, data: item });
  });
  if (report.plots) {
    const order = [];const map = new Map();
    report.plots.forEach((p) => {
      if (!map.has(p.group)) {map.set(p.group, []);order.push(p.group);}
      map.get(p.group).push(p);
    });
    order.forEach((g) => tabs.push({ id: nrSanitise(g), label: g, type: 'plot', data: map.get(g) }));
  }
  return tabs;
}

// short, readable hint of what the plot shows — drawn inside the placeholder
function nrPlotHint(fn) {
  return fn.replace(/\.(png|jpg|jpeg|gif|svg)$/i, '').replace(/_/g, ' ');
}

function NightReportTextTab({ item }) {
  if (item.type === 'multiline') {
    return <pre className="nr-log">{item.content}</pre>;
  }
  if (item.type === 'keyvalues') {
    return (
      <div className="nr-kv">
        {Object.entries(item.content).map(([k, v]) =>
        <React.Fragment key={k}>
            <div className="k">{k}</div>
            <div className="v">{v}</div>
          </React.Fragment>
        )}
      </div>);

  }
  if (item.type === 'links') {
    return (
      <div className="nr-links">
        {item.content.map((l) =>
        <a className="nr-link" key={l.url} href={l.url} onClick={(e) => e.preventDefault()}>
            <span className="lk">{l.label}</span>
            <span className="ld">{l.url}</span>
            <span className="arr">↗</span>
          </a>
        )}
      </div>);

  }
  return null;
}

function NightReportPlotsTab({ plots }) {
  return (
    <div className="nr-plot-grid">
      {plots.map((p) =>
      <figure className="nr-plot" key={p.filename}>
          <div className="ph">
            <span className="stamp">{nrPlotHint(p.filename)}</span>
            <span className="axes">plot image</span>
          </div>
          <figcaption>{p.filename}</figcaption>
        </figure>
      )}
    </div>);

}

function NightReportView() {
  const baseTabs = useMemo(() => nrGetTabs(NIGHT_REPORT), []);
  // Hidden easter-egg tab, revealed by typing 'elana' (as in the real app).
  const [eggOpen, setEggOpen] = useState(false);
  const tabs = useMemo(() => {
    const eggTab = {
      id: 'elana', label: 'elana', type: 'text', kind: 'multiline', egg: true,
      data: { type: 'multiline', content:
        "you found the hidden tab.\n\nin the real RubinTV night report this id\nlives in DEFAULT_HIDDEN_TABS and only\nappears once someone types its name." }
    };
    return eggOpen ? [...baseTabs, eggTab] : baseTabs;
  }, [baseTabs, eggOpen]);

  const [selected, setSelected] = useState(baseTabs[0].id);

  // Type-to-reveal listener for the hidden tab.
  useEffect(() => {
    let typed = '';
    const target = 'elana';
    const onKey = (e) => {
      if (e.key.length !== 1) return;
      typed = (typed + e.key.toLowerCase()).slice(-target.length);
      if (typed === target) {
        setEggOpen(true);
        setSelected('elana');
      }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  const cur = tabs.find((t) => t.id === selected) || tabs[0];

  return (
    <div className="nr-root">
      <div className="nr-head">
        <h3>Nightly Summary</h3>
        <span className="meta">dayObs 20260608 · Simonyi / LSSTCam</span>
        <span style={{ flex: 1 }} />
        <span className="tag live"><span className="hand">auto-refresh</span></span>
      </div>

      <div className="nr-tabwrap">
        <div className="nr-subtabs">
          {tabs.map((tab) =>
          <div
            key={tab.id}
            className={`nr-subtab ${tab.id === selected ? 'active' : ''} ${tab.egg ? 'egg' : ''}`}
            onClick={() => setSelected(tab.id)}>
              <span>{tab.label}</span>
              {tab.type === 'plot' ?
            <span className="pct">{tab.data.length}</span> :
            <span className="kind">{tab.kind === 'keyvalues' ? 'key/val' : tab.kind === 'multiline' ? 'text' : 'links'}</span>}
            </div>
          )}
        </div>
      </div>

      <div className="nr-panel">
        {cur.type === 'plot' ?
        <NightReportPlotsTab plots={cur.data} /> :
        <div className="nr-text">
            <div className="lead">
              <span>{cur.label}</span>
              <span className="pill">{cur.kind === 'keyvalues' ? 'KEY / VALUE' : cur.kind === 'multiline' ? 'MULTILINE' : 'LINKS'}</span>
            </div>
            <NightReportTextTab item={cur.data} />
          </div>
        }
      </div>
    </div>);

}

/* Clickable breadcrumb. Each segment may carry an onClick to navigate; the
   last (current) segment is plain text. */
function Crumb({ segments }) {
  return (
    <div className="crumb">
      {segments.map((s, i) =>
      <React.Fragment key={i}>
          {i > 0 && <span className="sep">›</span>}
          {s.onClick ?
        <span className="seg link" onClick={s.onClick}>{s.label}</span> :
        <span className="seg">{s.label}</span>}
        </React.Fragment>
      )}
    </div>);

}

/* Home — choose a location. */
function HomePage({ onPickLocation }) {
  return (
    <div className="landing" data-screen-label="home">
      <div style={{ position: "fixed", top: "20px", right: "24px", zIndex: 20 }}><ThemeToggle /></div>
      <div className="landing-inner">
        <div className="home-hero">
          <img className="brand-logo brand-logo-light" src="assets/rubin-logo.png" alt="Vera C. Rubin Observatory" />
          <img className="brand-logo brand-logo-dark" src="assets/rubin-logo-dark.png" alt="Vera C. Rubin Observatory" />
        </div>
        <div className="home-tagline"><b>RubinTV</b><span className="sep"></span>live camera displays</div>

        <div className="landing-h">Choose a location</div>
        <div className="loc-grid">
          {LOCATIONS.map((l) => {
            const cams = groupsForLocation(l.id).flatMap((g) => g.cams);
            const online = cams.filter((c) => c.online).length;
            return (
              <div key={l.id} className="loc-card" onClick={() => onPickLocation(l.id)}>
                <div className="loc-card-top">
                  <span className="loc-name">{l.name}</span>
                  <span className="loc-arrow">→</span>
                </div>
                <div className="loc-label">{l.id}</div>
                <div className="loc-blurb">{l.blurb}</div>
                <div className="loc-foot">
                  <span className="loc-stat"><span className="dot" /> {online} live</span>
                  <span className="loc-stat dim">{cams.length} cameras</span>
                </div>
              </div>);

          })}
        </div>
      </div>
    </div>);

}

/* Location — choose a camera offered at this site. */
function LocationPage({ locId, onHome, onPickCam }) {
  const loc = locationById(locId);
  const groups = groupsForLocation(locId);
  return (
    <div className="landing" data-screen-label={`location:${locId}`}>
      <div className="landing-topbar">
        <Crumb segments={[{ label: 'home', onClick: onHome }, { label: locId }]} />
        <div className="title-row" style={{ alignItems: 'flex-start' }}>
          <h2>{loc.name}</h2>
          <span style={{ flex: 1 }} />
          <ThemeToggle />
          <span className="tag live"><span className="hand">live</span></span>
        </div>
      </div>

      <div className="landing-inner">
        <div className="landing-h">Cameras at {locId}</div>
        {groups.map((g) =>
        <div key={g.label} className="cam-group">
            <div className="cam-group-h">{g.label}</div>
            <div className="cam-grid">
              {g.cams.map((c) =>
            <div
              key={c.name}
              className={`cam-card ${!c.online ? 'off' : ''}`}
              onClick={() => c.online && onPickCam(c.name)}>
              
                  <span className="cam-card-name">{c.name}</span>
                  <span className={`cam-card-status ${c.online ? 'on' : ''}`}>{c.online ? 'live' : 'offline'}</span>
                </div>
            )}
            </div>
          </div>
        )}
      </div>
    </div>);

}

function App() {
  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  // Navigation: 'home' (locations) → 'location' (cameras) → 'camera' (the
  // table / feed). Persisted so a reload keeps you where you were.
  const [page, setPage] = useState(() => localStorage.getItem('rubintv.page') || 'home');
  const [activeLocation, setActiveLocation] = useState(() => localStorage.getItem('rubintv.loc') || 'summit-usdf');
  const [activeCam, setActiveCam] = useState(() => localStorage.getItem('rubintv.cam') || 'LSSTCam');
  const [activeSystem, setActiveSystem] = useState(null); // 'Detectors' | 'Admin' | null
  const [activeTab, setActiveTab] = useState('Table');
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [filters, setFilters] = useState([]);
  // Per-column visibility — track the HIDDEN set (default empty means
  // "everything in DEFAULT_VISIBLE is on"). Only metadata columns are
  // ever hidden; channels and Seq.No are always shown.
  const [hiddenCols, setHiddenCols] = useState(() => {
    const h = new Set();
    for (const c of META_COLS) if (!DEFAULT_VISIBLE.has(c.key)) h.add(c.key);
    return h;
  });

  const showCamera = !activeSystem;

  useEffect(() => {localStorage.setItem('rubintv.page', page);}, [page]);
  useEffect(() => {localStorage.setItem('rubintv.loc', activeLocation);}, [activeLocation]);
  useEffect(() => {localStorage.setItem('rubintv.cam', activeCam);}, [activeCam]);

  // Switching cameras may change which views exist (All Sky only has Feed).
  // Reset to the camera's first valid view when the current one isn't offered.
  const viewForCam = (name, current) => {
    const views = viewsForCam(name);
    return views.some((v) => v.id === current) ? current : views[0].id;
  };
  const pickCam = (name) => {
    setActiveSystem(null);
    setActiveCam(name);
    setActiveTab((tab) => viewForCam(name, tab));
  };

  // Navigation handlers.
  const goHome = () => {setActiveSystem(null);setPage('home');};
  const goLocation = (id) => {
    const loc = id || activeLocation;
    setActiveLocation(loc);
    setActiveSystem(null);
    setPage('location');
  };
  const openCamFromLocation = (name) => {
    setActiveCam(name);
    setActiveSystem(null);
    setActiveTab((tab) => viewForCam(name, tab));
    setPage('camera');
  };

  if (page === 'home') {
    return <HomePage onPickLocation={goLocation} />;
  }
  if (page === 'location') {
    return <LocationPage locId={activeLocation} onHome={goHome} onPickCam={openCamFromLocation} />;
  }

  return (
    <div className={`shell ${sidebarOpen ? '' : 'collapsed'}`}>
      {sidebarOpen ?
      <Sidebar groups={groupsForLocation(activeLocation)} activeCam={activeCam} onPickCam={pickCam} activeSystem={activeSystem} onPickSystem={setActiveSystem} activeTab={activeTab} onPickView={setActiveTab} activeLocation={activeLocation} locations={LOCATIONS} onPickLocation={goLocation} onClose={() => setSidebarOpen(false)} /> :
      <div />
      }
      <div className="main">
        {showCamera ? <>
        <div className="topbar">
          {!sidebarOpen &&
            <div className="topbar-leftgutter">
              <button className="sidebar-reopen" onClick={() => setSidebarOpen(true)} title="Show sidebar" aria-label="Show sidebar" data-comment-anchor="d90a460e45-button-313-9">»</button>
              <ThemeToggle vertical />
            </div>
            }
          <Crumb segments={[
            { label: 'home', onClick: goHome },
            { label: activeLocation, onClick: () => goLocation() },
            { label: activeCam.toLowerCase() }]} />
          <div className="title-row" style={{ alignItems: "flex-start" }}>
            <h2>{activeCam}</h2>
            <span style={{ flex: 1 }} />
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
              {!sidebarOpen &&
                <div className="topbar-brand">
                  <img className="brand-mark" src="assets/rubin-mark.png" alt="Vera C. Rubin Observatory" />
                  <span className="brand">RubinTV</span>
                  <span className="site">{activeLocation}</span>
                </div>
                }
              <LiveStatusPill />
            </div>
          </div>
          <div className="tabs">
            {viewsForCam(activeCam).map((v) =>
              <div
                key={v.id}
                className={`tab ${activeTab === v.id ? 'active' : ''}`}
                onClick={() => setActiveTab(v.id)}>
                {v.label}
                {v.count != null && <span className="count">{v.count}</span>}
              </div>
            )}
          </div>
        </div>

        {activeTab === 'Feed' ? <AllSkyFeed /> : activeTab === 'Channels' ? <ChannelsView /> : activeTab === 'Night report' ? <NightReportView /> : <>
        <div className="controls">
          <span className="btn">◀</span>
          <DatePicker style={t.datePickerStyle} />
          <span className="btn">▶</span>
          <ColumnPicker hiddenCols={hiddenCols} setHiddenCols={setHiddenCols} />
          <FilterControl filters={filters} setFilters={setFilters} />
          <span className="btn"><DownloadIcon />metadata</span>
          <span className="ctrl-spacer" />
        </div>

        <FilterBar filters={filters} setFilters={setFilters} />

        <Table
              headerStyle={t.headerStyle}
              density={t.density}
              channelColumns={t.channelColumns}
              showAnnotations={t.showAnnotations}
              filters={filters}
              setFilters={setFilters}
              hiddenCols={hiddenCols} />
          

        <div className="hintbar">
          <span>← → arrow keys to jump rows</span>
          <span style={{ flex: 1 }} />
          <span><kbd>?</kbd> shortcuts</span>
        </div>
        </>}
        </> : <>
        <div className="topbar">
          {!sidebarOpen &&
            <div className="topbar-leftgutter">
              <button className="sidebar-reopen" onClick={() => setSidebarOpen(true)} title="Show sidebar" aria-label="Show sidebar">»</button>
              <ThemeToggle vertical />
            </div>
            }
          <Crumb segments={[
            { label: 'home', onClick: goHome },
            { label: activeLocation, onClick: () => goLocation() },
            { label: activeSystem.toLowerCase() }]} />
          <div className="title-row">
            <h2>{activeSystem}</h2>
            <span className="meta">{activeSystem === 'Detectors' ? 'cluster status · redis stream' : 'redis controls'}</span>
            <span style={{ flex: 1 }} />
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
              {!sidebarOpen &&
                <div className="topbar-brand">
                  <img className="brand-mark" src="assets/rubin-mark.png" alt="Vera C. Rubin Observatory" />
                  <span className="brand">RubinTV</span>
                  <span className="site">{activeLocation}</span>
                </div>
                }
          <span className="tag live"><span className="hand">live</span></span>
            </div>
          </div>
        </div>
        <div style={{ flex: 1, padding: 32, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div className="wf wf-dashed" style={{ padding: 28, textAlign: 'center', maxWidth: 460 }}>
            <div className="hand-b" style={{ fontSize: 20, marginBottom: 6 }}>{activeSystem} — own page</div>
            <div className="hand" style={{ fontSize: 13, color: 'var(--ink-soft)' }}>
              reached from the sidebar, not from camera tabs.<br />
              see the wireframe explorations for {activeSystem === 'Detectors' ? 'cluster status views' : 'admin / redis controls'}.
            </div>
          </div>
        </div>
        </>}
      </div>

      {window.TweaksPanel &&
      <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Column headers">
            <window.TweakSelect
            label="Header style"
            value={t.headerStyle}
            onChange={(v) => setTweak('headerStyle', v)}
            options={[
            { value: 'stacked', label: 'Stacked (words on lines)' },
            { value: 'angled', label: 'Angled (-35°)' },
            { value: 'vertical', label: 'Vertical (90°)' },
            { value: 'ellipsis', label: 'Ellipsis + hover' },
            { value: 'wrap', label: 'Wrapped (multi-line)' }]
            } />
          
          </window.TweakSection>
          <window.TweakSection title="Density">
            <window.TweakRadio
            label="Row density"
            value={t.density}
            onChange={(v) => setTweak('density', v)}
            options={[
            { value: 'compact', label: 'Compact' },
            { value: 'regular', label: 'Regular' },
            { value: 'comfy', label: 'Comfy' }]
            } />
          
          </window.TweakSection>
          <window.TweakSection title="Date picker">
            <window.TweakSelect
            label="Picker style"
            value={t.datePickerStyle}
            onChange={(v) => setTweak('datePickerStyle', v)}
            options={[
            { value: 'classic', label: 'Classic — single month' },
            { value: 'two-months', label: 'Two months side-by-side' },
            { value: 'nights', label: 'Recent nights list' }]
            } />
          
          </window.TweakSection>
          <window.TweakSection title="View">
            <window.TweakToggle label="Channel image cells" value={t.channelColumns} onChange={(v) => setTweak('channelColumns', v)} />
            <window.TweakToggle label="Designer annotations" value={t.showAnnotations} onChange={(v) => setTweak('showAnnotations', v)} />
          </window.TweakSection>
        </window.TweaksPanel>
      }
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
