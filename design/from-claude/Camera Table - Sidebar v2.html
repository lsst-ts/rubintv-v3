<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RubinTV — Camera Table (sidebar) header explorations</title>
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; }
  body {
    background: var(--paper);
    overflow: hidden;
  }
  .shell {
    height: 100vh;
    display: grid;
    grid-template-columns: 240px 1fr;
    transition: grid-template-columns 180ms ease;
  }
  .shell.collapsed { grid-template-columns: 0 1fr; }

  /* Sidebar */
  .sidebar {
    border-right: 1.5px solid var(--stroke);
    background: var(--paper-2);
    padding: 18px 14px;
    overflow: hidden auto;
    position: relative;
    min-width: 0;
    display: flex; flex-direction: column;
  }
  .shell.collapsed .sidebar { border-right: none; padding: 0; }
  .sidebar-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    margin-bottom: 4px;
  }
  .icon-btn {
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.25px solid var(--stroke);
    border-radius: 4px;
    background: var(--paper);
    cursor: pointer;
    font-family: var(--mono); font-size: 13px; line-height: 1;
    color: var(--ink);
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--paper-3); }

  /* Sidebar footer — pinned to the bottom; home for the global theme toggle */
  .sidebar-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sidebar-foot .foot-label {
    font-family: var(--hand); font-size: 12px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* Small reopen tab — just the chevron, no brand text. Lives in the
     space the sidebar vacated. */
  /* Reopen tab — anchored to the bottom-left of the topbar so it meets the
     header bottom border. */
  .topbar { position: relative; }
  .sidebar-reopen {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.25px solid var(--stroke); border-radius: 4px;
    background: var(--paper-2);
    cursor: pointer;
    font-family: var(--mono); font-size: 14px; line-height: 1;
  }
  .sidebar-reopen:hover { background: var(--paper-3); }

  /* Collapsed-sidebar left gutter — reopen button + vertical appearance picker,
     top-anchored so they fill the space the sidebar vacated. */
  .topbar-leftgutter {
    position: absolute; top: 13px; left: 10px; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  /* Brand block in the topbar right column — one compact line, visible only
     when the sidebar is collapsed. */
  .topbar-brand {
    display: flex; flex-direction: row; align-items: center;
    gap: 7px; line-height: 1;
    margin-bottom: 0;
  }
  .topbar-brand .brand-mark { height: 13px; margin-bottom: 0; }
  .topbar-brand .brand { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .topbar-brand .site  {
    font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
    padding-left: 7px; border-left: 1px solid var(--line-mid);
  }
  .sidebar h1 { font-family: var(--hand); font-weight: 700; font-size: 22px; margin: 0; }
  .sidebar .site { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .sidebar .group-h {
    font-family: var(--hand); font-size: 11px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 14px 6px 4px;
  }
  .sidebar .cam {
    font-family: var(--hand); font-size: 13px;
    padding: 5px 10px; margin-bottom: 2px;
    border: 1.25px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar .cam:hover { background: var(--paper-3); }
  .sidebar .cam.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sidebar .cam.dim { color: var(--ink-soft); }
  .sidebar .cam .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
  }
  .sidebar .cam.dim .dot { background: var(--line-soft); }

  /* Camera pills (wireframe-B sidebar) + per-camera view list */
  .sidebar .cam-pills {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 6px 6px 2px;
  }
  .sidebar .cam-pill {
    font-family: var(--hand); font-size: 13px; line-height: 1;
    padding: 6px 11px;
    border: 1.25px solid var(--stroke); border-radius: 6px;
    background: var(--paper); color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .sidebar .cam-pill:hover { background: var(--paper-3); }
  .sidebar .cam-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sidebar .cam-pill.dim {
    color: var(--ink-soft); border-color: var(--line-soft);
    cursor: default; opacity: 0.6;
  }
  .sidebar .cam-pill .pdot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--good);
    flex-shrink: 0;
  }
  .sidebar .cam-pill.active .pdot { background: var(--paper); }
  .sidebar .cam-pill.dim .pdot { background: var(--line-soft); }

  .sidebar .view-list { margin-top: 2px; }
  .sidebar .view-item {
    font-family: var(--hand); font-size: 14px;
    padding: 6px 10px; margin: 0 6px 2px;
    border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar .view-item:hover { background: var(--paper-3); }
  .sidebar .view-item.active { background: var(--accent-soft); font-weight: 600; }
  .sidebar .view-item .vbullet {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--line-soft); flex-shrink: 0;
  }
  .sidebar .view-item.active .vbullet { background: var(--accent); }
  .sidebar .view-item .vcount {
    margin-left: auto; font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft);
  }

  /* All-sky feed view */
  .allsky-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .allsky-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper-2);
    position: relative; z-index: 5;
  }
  .amovie-label { font-family: var(--hand); font-size: 13px; color: var(--ink-soft); }
  .amovie-reset {
    font-family: var(--hand); font-size: 12px; color: var(--accent);
    border-bottom: 1px dashed var(--accent); cursor: pointer;
  }
  .amovie-reset:hover { color: var(--ink); border-bottom-color: var(--ink); }

  .allsky-stage {
    flex: 1; min-height: 0; display: flex; gap: 22px;
    align-items: flex-start; padding: 18px 22px 22px; overflow: auto;
  }
  .allsky-col {
    flex: 1; min-width: 0; max-width: 540px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .allsky-mediahead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 0 2px;
  }
  .amh-title { font-family: var(--hand); font-weight: 700; font-size: 16px; }
  .amh-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); }
  .allsky-frame {
    border: 1.5px solid var(--stroke); border-radius: 8px;
    background: var(--paper-2); padding: 10px;
  }
  .allsky-ph {
    position: relative;
    aspect-ratio: 1 / 1; border-radius: 6px;
    border: 1px solid var(--line-soft);
    background:
      repeating-linear-gradient(45deg, transparent 0 11px, rgba(0,0,0,0.035) 11px 22px),
      radial-gradient(circle at 50% 48%, var(--paper) 0 54%, var(--paper-3) 70%, var(--paper-2) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .allsky-cap {
    font-family: var(--mono); font-size: 13px; color: var(--ink-soft);
    letter-spacing: 0.5px; white-space: nowrap;
  }
  .allsky-sub {
    font-family: var(--mono); font-size: 10px; color: var(--line-soft);
    white-space: nowrap;
  }
  .amovie-play {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid var(--ink-soft); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; padding-left: 3px; margin-bottom: 8px;
  }

  /* ---------- Breadcrumbs (clickable) ---------- */
  .crumb { font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .crumb .seg { color: var(--ink-soft); }
  .crumb .seg.link { cursor: pointer; border-bottom: 1px dashed transparent; }
  .crumb .seg.link:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .crumb .sep { color: var(--line-soft); }

  /* ---------- Landing pages (home + location) ---------- */
  .landing {
    height: 100vh; overflow: auto;
    background: var(--paper);
    padding: 0;
  }
  .landing-inner { max-width: 1080px; margin: 0 auto; padding: 40px 48px 64px; }
  .landing-topbar {
    padding: 14px 22px 14px;
    border-bottom: 1.5px solid var(--stroke);
    background: var(--paper);
    position: sticky; top: 0; z-index: 4;
  }
  .landing-brand { font-family: var(--hand); font-weight: 700; font-size: 46px; margin: 0; line-height: 1; }
  .landing-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .landing-h {
    font-family: var(--hand); font-size: 14px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.6px;
    margin: 38px 0 14px;
  }

  /* Location cards (home) */
  .loc-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  }
  .loc-card {
    border: 1.5px solid var(--stroke); border-radius: 8px;
    background: var(--paper-2); padding: 18px 18px 14px;
    cursor: pointer; transition: background 120ms ease, transform 120ms ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  .loc-card:hover { background: var(--paper-3); transform: translateY(-2px); }
  .loc-card-top { display: flex; align-items: center; justify-content: space-between; }
  .loc-name { font-family: var(--hand); font-weight: 700; font-size: 24px; white-space: nowrap; }
  .loc-arrow { font-family: var(--mono); font-size: 18px; color: var(--ink-soft); }
  .loc-card:hover .loc-arrow { color: var(--accent); }
  .loc-label { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .loc-blurb { font-family: var(--hand); font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .loc-foot {
    display: flex; align-items: center; gap: 14px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--line-soft);
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
  }
  .loc-stat { display: inline-flex; align-items: center; gap: 6px; }
  .loc-stat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .loc-stat.dim { color: var(--line-soft); }

  /* Camera cards (location page) */
  .cam-group { margin-bottom: 22px; }
  .cam-group-h {
    font-family: var(--hand); font-size: 13px; color: var(--ink-soft);
    margin-bottom: 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .cam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .cam-card {
    border: 1.5px solid var(--stroke); border-radius: 7px;
    background: var(--paper); padding: 14px 14px 12px;
    cursor: pointer; transition: background 120ms ease, transform 120ms ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cam-card:hover { background: var(--paper-2); transform: translateY(-2px); }
  .cam-card.off { opacity: 0.55; cursor: not-allowed; }
  .cam-card.off:hover { background: var(--paper); transform: none; }
  .cam-card-name { font-family: var(--hand); font-weight: 700; font-size: 17px; }
  .cam-card-status {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft);
  }
  .cam-card-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--line-soft); }
  .cam-card-status.on { color: var(--good); }
  .cam-card-status.on::before { background: var(--good); }

  /* Main */
  .main { overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .topbar {
    padding: 12px 22px 0;
    border-bottom: 1.5px solid var(--stroke);
    background: var(--paper);
  }
  /* When sidebar is closed, leave just enough left-padding for the reopen
     button; the page title fills the freed space. */
  .shell.collapsed .topbar { padding-left: 56px; min-height: 116px; }
  .crumb { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .title-row {
    display: flex; align-items: baseline; gap: 14px; margin-top: 4px;
  }
  .title-row h2 { font-family: var(--hand); font-weight: 700; font-size: 30px; margin: 0; }
  .title-row .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }

  /* Live status pill — combined indicator. Pulsing dot from .tag.live
     (border, pinkish bg) is in styles.css. Two rows, label left,
     mono time numerals right — column-aligned via grid + tabular-nums
     so the seconds digits line up vertically. */
  .status-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 5px 14px 6px 12px;
    line-height: 1.1;
  }
  .status-pill .clocks {
    display: grid;
    grid-template-columns: auto auto;
    column-gap: 8px;
    row-gap: 1px;
    align-items: baseline;
  }
  .status-pill .clock-label {
    font-family: var(--hand);
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: right;
    line-height: 1.1;
  }
  .status-pill .clock-time {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: 0.1px;
  }
  .status-pill .clock-time .ms {
    font-size: 9px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-left: 1px;
  }

  .tabs {
    display: flex; gap: 4px; margin-top: 12px;
    border-bottom: 1px solid var(--line-mid);
  }
  .tab {
    font-family: var(--display); font-size: 14px; font-weight: 500;
    letter-spacing: -0.005em;
    padding: 9px 15px 10px;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 7px;
    transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    border-radius: 5px 5px 0 0;
  }
  .tab:hover { color: var(--ink); background: var(--paper-2); }
  .tab.active {
    color: var(--ink);
    font-weight: 700;
    border-bottom-color: var(--accent);
    background: transparent;
  }
  .tab .count {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--ink-soft);
    background: var(--paper-3);
    padding: 1px 6px; border-radius: 999px;
    line-height: 1.5;
  }
  .tab.active .count { background: var(--accent-soft); color: var(--accent); }

  /* Controls bar */
  .controls {
    padding: 10px 22px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper);
    position: relative;
  }
  .ctrl-spacer { flex: 1; }

  /* ---------- Date picker ----------
     The .btn-tab 📅 control opens a popover anchored below it. Three
     visual variants are exposed as a tweak so the team can compare:
       • 'classic'     — single-month grid + arrows
       • 'two-months'  — two months side by side, no sidebar
       • 'nights'      — vertical list of recent observing nights, with
                          per-night metadata (image count, dome, seeing) and
                          a small month mini-map
     All three share the popover frame + month-grid pieces below.
     Day cells show the MAX SEQ NUM for each observed night beneath the
     date — a number is more informative than the dot we had originally. */
  .date-cluster { position: relative; display: inline-flex; }
  .date-pop {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    background: var(--paper);
    border: 1.5px solid var(--stroke);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    z-index: 30;
    font-family: var(--hand);
    display: flex;
    overflow: hidden;
  }
  .date-pop.v-classic { width: 280px; }
  .date-pop.v-two-months { width: 580px; }
  .date-pop.v-nights  { width: 460px; max-height: 380px; }

  /* Month grid — shared by classic + presets */
  .dp-month { flex: 1; padding: 10px 12px 12px; }
  .dp-mhead {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .dp-mhead .month {
    font-family: var(--hand); font-weight: 700; font-size: 14px;
  }
  .dp-mhead .yr {
    font-family: var(--mono); font-size: 11px; color: var(--ink-soft);
    margin-left: 4px;
  }
  .dp-mhead .arr {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.25px solid var(--stroke); border-radius: 3px;
    background: var(--paper);
    font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .dp-mhead .arr:hover { background: var(--paper-3); }
  .dp-mhead .arrs { display: inline-flex; gap: 4px; }
  .dp-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  .dp-grid .dow {
    font-family: var(--mono); font-size: 9px;
    color: var(--ink-soft);
    text-align: center;
    padding: 4px 0 5px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .dp-day {
    height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink);
    border: 1.25px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    font-variant-numeric: tabular-nums;
    padding: 2px 0;
  }
  .dp-day .num { font-size: 11px; line-height: 1; }
  .dp-day .ct {
    font-size: 9px;
    line-height: 1;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .dp-day:hover { background: var(--paper-3); }
  .dp-day.out { color: var(--line-soft); cursor: default; }
  .dp-day.out:hover { background: transparent; }
  .dp-day.out .ct { color: var(--line-soft); }
  .dp-day.today {
    border-color: var(--ink);
    font-weight: 700;
  }
  .dp-day.selected {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
  }
  .dp-day.selected .ct { color: var(--paper); opacity: 0.85; }
  .dp-day.in-range { background: var(--accent-soft); }
  .dp-day.disabled { color: var(--line-soft); cursor: not-allowed; }
  .dp-day.disabled:hover { background: transparent; }

  .dp-foot {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft);
  }
  .dp-foot .input {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11px;
    padding: 3px 6px;
    border: 1.25px solid var(--stroke); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  .dp-foot .today-link {
    cursor: pointer;
    font-family: var(--hand); font-size: 11px;
    color: var(--accent);
    border-bottom: 1px dashed var(--accent);
  }
  .dp-foot .today-link:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Legend strip beneath grid (classic + presets) */
  .dp-legend {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 6px;
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
  }
  .dp-legend .swatch {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* Two-month grid wrapper */
  .dp-two {
    display: flex; flex-direction: column;
    width: 100%;
  }
  .dp-two-grids {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .dp-two-grids .dp-month { padding: 10px 12px 6px; }
  .dp-two-grids .dp-month + .dp-month {
    border-left: 1px solid var(--line-soft);
  }
  .dp-two-foot {
    padding: 8px 14px 10px;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-soft);
    background: var(--paper-2);
  }
  .dp-two-foot .input {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 12px;
    padding: 4px 8px;
    border: 1.25px solid var(--stroke); border-radius: 3px;
    background: var(--paper); color: var(--ink);
  }
  .dp-two-foot .today-link {
    cursor: pointer;
    font-family: var(--hand); font-size: 12px;
    color: var(--accent);
    border-bottom: 1px dashed var(--accent);
  }
  .dp-two-foot .today-link:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Presets sidebar (unused; kept so .dp-presets CSS doesn't 404 if
     something else references it) */
  .dp-presets {
    width: 200px;
    border-right: 1px solid var(--line-soft);
    background: var(--paper-2);
    padding: 10px 8px;
    display: flex; flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }
  .dp-presets .ph {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.3px;
    padding: 4px 6px 2px;
    background: transparent;
    border: none;
    white-space: nowrap;
  }
  .dp-preset {
    padding: 5px 8px;
    font-family: var(--hand); font-size: 12px;
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
    white-space: nowrap;
  }
  .dp-preset > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .dp-preset:hover { background: var(--paper-3); }
  .dp-preset.active { background: var(--ink); color: var(--paper); }
  .dp-preset .pmeta {
    font-family: var(--mono); font-size: 9px;
    color: var(--ink-soft);
  }
  .dp-preset.active .pmeta { color: var(--paper); opacity: 0.7; }

  /* Nights list variant */
  .dp-nights-wrap { display: flex; width: 100%; min-height: 0; }
  .dp-nights-list {
    flex: 1; min-width: 0;
    overflow-y: auto;
    padding: 6px 0;
  }
  .dp-nights-list .nhdr {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 6px 12px 4px;
    position: sticky; top: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line-soft);
    z-index: 1;
  }
  .night-row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    column-gap: 10px;
    align-items: center;
    padding: 6px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
  }
  .night-row:hover { background: var(--paper-3); }
  .night-row.selected { background: var(--accent-soft); }
  .night-row .ndate {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .night-row .ndow {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .night-row .nmid {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .night-row .nlabel {
    font-family: var(--hand); font-size: 12px;
    color: var(--ink);
  }
  .night-row .nmeta {
    font-family: var(--mono); font-size: 9.5px;
    color: var(--ink-soft);
    display: flex; gap: 8px;
  }
  .night-row .nmeta .bad { color: var(--warn); }
  .night-row .ncount {
    font-family: var(--mono); font-size: 12px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .night-row .ncount .imgs {
    font-family: var(--hand); font-size: 9px;
    color: var(--ink-soft);
    display: block; text-transform: uppercase; letter-spacing: 0.3px;
  }
  /* Bar chart under image count, showing image volume across the night */
  .night-row .nbars {
    display: flex; align-items: flex-end; gap: 1px;
    height: 14px;
  }
  .night-row .nbars span {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    opacity: 0.6;
  }
  .night-row.selected .nbars span { opacity: 1; }

  /* Mini month map on the right of the nights variant */
  .dp-minimap {
    width: 160px;
    border-left: 1px solid var(--line-soft);
    background: var(--paper-2);
    padding: 10px 10px 12px;
    flex-shrink: 0;
  }
  .dp-minimap .mm-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .dp-minimap .mm-month {
    font-family: var(--hand); font-weight: 700; font-size: 12px;
  }
  .dp-minimap .mm-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  .dp-minimap .mm-day {
    aspect-ratio: 1;
    font-family: var(--mono); font-size: 8.5px;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 2px;
    position: relative;
  }
  .dp-minimap .mm-day:hover { background: var(--paper-3); }
  .dp-minimap .mm-day.out { color: var(--line-soft); }
  .dp-minimap .mm-day.has-data { color: var(--ink); font-weight: 600; }
  .dp-minimap .mm-day.has-data::after {
    content: ''; position: absolute; bottom: 1px;
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--accent);
  }
  .dp-minimap .mm-day.selected {
    background: var(--ink); color: var(--paper);
  }
  .dp-minimap .mm-day.selected::after { background: var(--paper); }
  .dp-minimap .mm-legend {
    margin-top: 8px;
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  /* Column picker popover — wider than the filter popover because it
     shows all columns at once in a multi-column grid. Sized to fit a
     reasonable number of columns without horizontal scroll; the grid
     auto-wraps vertically as needed. */
  .cols-cluster { position: relative; display: inline-flex; }
  .cols-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    font-family: var(--hand); font-size: 13px;
    border: 1.25px solid var(--stroke);
    border-radius: 4px;
    background: var(--paper);
    cursor: pointer;
  }
  .cols-btn:hover { background: var(--paper-3); }
  .cols-btn.active { background: var(--accent-soft); border-color: var(--accent); }
  .cols-btn .frac {
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft);
  }
  .picker-pop {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    width: min(720px, calc(100vw - 40px));
    max-height: 70vh;
    background: var(--paper);
    border: 1.5px solid var(--stroke);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    z-index: 20;
    display: flex; flex-direction: column;
    font-family: var(--hand);
  }
  .picker-head {
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .picker-head .title {
    font-family: var(--hand); font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .picker-head .count {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-soft);
  }
  .picker-head .count b { color: var(--ink); }
  .picker-head input.search {
    flex: 1; min-width: 140px;
    font-family: var(--mono); font-size: 12px;
    padding: 5px 8px;
    border: 1.25px solid var(--stroke);
    border-radius: 3px;
    background: var(--paper);
  }
  .picker-head .bulk {
    display: inline-flex; gap: 6px;
  }
  .picker-head .bulk button {
    font-family: var(--hand); font-size: 12px;
    padding: 4px 10px;
    border: 1.25px solid var(--stroke); border-radius: 3px;
    background: var(--paper); cursor: pointer;
  }
  .picker-head .bulk button:hover { background: var(--paper-3); }
  .picker-body {
    flex: 1; overflow-y: auto;
    padding: 8px 14px 12px;
  }
  .picker-group { margin-top: 12px; }
  .picker-group:first-child { margin-top: 2px; }
  .picker-group .group-title {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 6px;
    display: flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid var(--line-soft);
    padding-bottom: 3px;
  }
  .picker-group .group-title .num {
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft);
  }
  .picker-group .group-title .group-bulk {
    margin-left: auto;
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .picker-group .group-title .group-bulk:hover { color: var(--accent); }
  /* Auto-fill grid — as many columns as the popover width allows. */
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 2px 14px;
  }
  .picker-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--hand); font-size: 13px;
    color: var(--ink);
    user-select: none;
  }
  .picker-item:hover { background: var(--paper-3); }
  .picker-item.dim { color: var(--ink-soft); }
  .picker-item input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .picker-item .label-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-item mark {
    background: transparent; color: var(--accent); font-weight: 700;
    padding: 0;
  }
  .picker-item .swatch {
    width: 10px; height: 10px;
    border: 1px solid var(--stroke);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .picker-foot {
    padding: 8px 14px;
    border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; gap: 10px;
    font-family: var(--hand); font-size: 11px; color: var(--ink-soft);
    background: var(--paper-2);
  }
  .picker-foot .spacer { flex: 1; }

  /* Filter chip strip — separate row below the controls bar so wrapping
     chips never affect the formatting of the controls row. */
  .filter-bar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    padding: 6px 22px;
    background: var(--paper-2);
    border-bottom: 1px solid var(--line-soft);
    min-height: 32px;
  }
  .filter-bar > .label {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-right: 2px;
  }
  .filter-bar .empty-hint {
    font-family: var(--hand); font-size: 12px;
    color: var(--ink-soft); font-style: italic;
  }

  /* Filter cluster ------------------------------------------------ */
  .filter-cluster { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    font-family: var(--hand); font-size: 13px;
    border: 1.25px solid var(--stroke);
    border-radius: 4px;
    background: var(--paper);
    cursor: pointer;
  }
  .filter-btn:hover { background: var(--paper-3); }
  .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); }
  .filter-btn .count {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 5px; border-radius: 10px;
    background: var(--accent); color: var(--paper);
  }

  .filter-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 4px 3px 8px;
    border: 1.25px solid var(--stroke); border-radius: 14px;
    background: var(--paper-2);
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    line-height: 1;
  }
  .filter-chip .col {
    font-family: var(--hand); font-weight: 600;
    color: var(--ink-soft);
  }
  .filter-chip .op {
    font-family: var(--mono); color: var(--ink-soft);
    padding: 0 2px;
  }
  .filter-chip .val { color: var(--ink); font-weight: 600; }
  .filter-chip .x {
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-family: var(--mono); font-size: 12px; line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    margin-left: 2px;
  }
  .filter-chip .x:hover { background: var(--ink); color: var(--paper); }
  .filter-clear {
    font-family: var(--hand); font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    margin-left: 2px;
    border-bottom: 1px solid var(--line-soft);
  }
  .filter-clear:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* Filter popover */
  .filter-pop {
    position: absolute;
    top: calc(100% + 6px); left: 0;
    width: 320px;
    background: var(--paper);
    border: 1.5px solid var(--stroke);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    z-index: 20;
    padding: 10px 12px 12px;
    font-family: var(--hand);
  }
  .filter-pop h4 {
    margin: 0 0 8px;
    font-family: var(--hand); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--ink-soft);
  }
  .filter-pop .row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .filter-pop label {
    font-family: var(--hand); font-size: 11px; color: var(--ink-soft);
    width: 38px;
  }
  .filter-pop select, .filter-pop input {
    flex: 1;
    font-family: var(--mono); font-size: 11px;
    padding: 4px 6px;
    border: 1.25px solid var(--stroke);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    min-width: 0;
  }
  .filter-pop select.op { flex: 0 0 56px; }
  .filter-pop .apply {
    display: inline-flex; align-items: center; justify-content: center;
    width: 100%;
    padding: 6px 0;
    margin-top: 4px;
    font-family: var(--hand); font-size: 13px; font-weight: 700;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 4px;
    cursor: pointer;
  }
  .filter-pop .apply:disabled { opacity: 0.4; cursor: not-allowed; }
  .filter-pop .apply:hover:not(:disabled) { background: var(--accent); }
  .filter-pop .hint {
    margin-top: 6px;
    font-family: var(--hand); font-size: 11px; color: var(--ink-soft);
  }
  .filter-pop .suggestions {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 4px;
  }
  .filter-pop .suggestion {
    font-family: var(--mono); font-size: 10px;
    padding: 2px 6px;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    background: var(--paper-2);
  }
  .filter-pop .suggestion:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }

  /* Fuzzy column combobox. Replaces the giant <select> — with 100+ columns
     a dropdown is unusable; typed substring/subsequence search is faster. */
  .filter-combo { position: relative; flex: 1; min-width: 0; }
  .filter-combo input {
    width: 100%;
    font-family: var(--mono); font-size: 11px;
    padding: 4px 6px;
    border: 1.25px solid var(--stroke);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    box-sizing: border-box;
  }
  .filter-combo input:focus { outline: 2px solid var(--accent-soft); outline-offset: -1px; }
  .filter-combo .list {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0;
    max-height: 180px; overflow-y: auto;
    background: var(--paper);
    border: 1.25px solid var(--stroke);
    border-radius: 3px;
    z-index: 30;
    box-shadow: var(--shadow-pop);
  }
  .filter-combo .count {
    padding: 4px 8px;
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line-soft);
    background: var(--paper-2);
    text-transform: uppercase; letter-spacing: 0.3px;
    position: sticky; top: 0; z-index: 1;
  }
  .filter-combo .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px;
    font-family: var(--mono); font-size: 11px;
    cursor: pointer;
    color: var(--ink);
    gap: 6px;
  }
  .filter-combo .item:hover { background: var(--paper-3); }
  .filter-combo .item.kbd-active { background: var(--accent-soft); }
  .filter-combo .item .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .filter-combo .item mark {
    background: transparent; color: var(--accent);
    font-weight: 700;
    padding: 0;
  }
  .filter-combo .item .type-pill {
    font-family: var(--hand); font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.3px;
    color: var(--ink-soft);
    padding: 1px 5px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    flex-shrink: 0;
  }
  .filter-combo .empty {
    padding: 8px;
    font-family: var(--hand); font-size: 11px;
    color: var(--ink-soft); font-style: italic;
    text-align: center;
  }
  .filter-pop .type-tag {
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    margin-left: auto;
    padding: 1px 6px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .filter-pop .col-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }

  /* Table area */
  .table-wrap {
    flex: 1;
    overflow: auto;
    background: var(--paper);
    position: relative;
  }
  .data-table {
    border-collapse: collapse;
    font-family: var(--mono);
    table-layout: fixed;
    width: max-content;
    min-width: 100%;
  }
  .data-table th, .data-table td {
    border-right: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    padding: 6px 8px;
    font-size: 11px;
    vertical-align: middle;
    background-clip: padding-box;
  }
  .data-table thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper-2);
    border-right: none;
    border-bottom: 1.5px solid var(--stroke);
    font-family: var(--hand);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    user-select: none;
  }
  /* Sticky seq column */
  .data-table th.seq, .data-table td.seq {
    position: sticky; left: 0;
    z-index: 4;
    background: var(--paper-2);
    border-right: 1.5px solid var(--stroke);
  }
  .data-table thead th.seq { z-index: 6; border-right: 1.5px solid var(--stroke); }

  /* Cell chip (for channel image previews) */
  .cell-chip {
    width: 26px; height: 26px;
    border: 1px solid var(--stroke);
    border-radius: 2px;
    display: inline-block;
  }

  /* Resizer removed per teammate feedback */

  /* HEADER STYLES */

  /* Style: ellipsis */
  .hs-ellipsis th .label {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 8px;
  }

  /* Style: wrap */
  .hs-wrap th .label {
    display: block;
    white-space: normal;
    line-height: 1.15;
    word-break: break-word;
    text-wrap: balance;
  }
  .hs-wrap thead th { vertical-align: bottom; padding-top: 10px; padding-bottom: 6px; }

  /* Style: stacked (words on separate lines, no rotation) */
  .hs-stacked thead th { vertical-align: bottom; padding: 8px 8px 6px; }
  .hs-stacked thead th .label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.05;
    gap: 1px;
    font-size: 11px;
  }
  .hs-stacked thead th .label span { display: block; }

  /* Style: angled
     Column widths come from the data. Header labels are rendered as a
     separate overlay layer (absolutely-positioned divs above the table)
     whose horizontal position is computed from each <th>'s actual offsetLeft.
     This way a label can extend rightward past its own column, only ever
     truncated when its diagonal projection would exceed --header-h.
     The full name is offered on hover via the div's title attribute.
     The seq.no column is rendered angled too, matching the other columns. */
  .hs-angled thead th {
    height: var(--header-h, 150px);
    vertical-align: bottom;
    padding: 0;
  }
  .hs-angled thead th:not(.seq) .label { display: none; } /* labels live in overlay */
  /* Seq column stays sticky-left and needs its label rendered IN the cell
     (the overlay scrolls horizontally with the rest of the content). */
  .hs-angled thead th.seq {
    padding: 6px 8px;
    z-index: 8;            /* sit above the header overlay (z:7) */
  }
  .hs-angled thead th.seq .label {
    font-family: var(--hand);
    font-size: 11px;
    font-weight: 600;
  }

  /* Overlay layer: one rotated div per column, positioned at the column's
     measured x-offset. Sits inside .table-wrap so it scrolls horizontally
     WITH the table content — do NOT pin to left:0 or labels will drift out
     of sync with their columns as the user scrolls right. Vertically, it
     sticks to top:0 so it stays put while the body scrolls. */
  .header-overlay {
    position: sticky;
    top: 0;
    /* no `left` — overlay flows horizontally with the table content */
    height: var(--header-h, 150px);
    margin-bottom: calc(var(--header-h, 150px) * -1);  /* overlap the thead band */
    pointer-events: none;
    z-index: 7;
  }
  .header-overlay-bg {
    position: absolute;
    inset: 0;
    background: var(--paper-2);
    border-bottom: 1.5px solid var(--stroke);
    pointer-events: none;
  }
  .header-overlay .hdr-label {
    position: absolute;
    bottom: 6px;
    transform: rotate(-45deg);
    transform-origin: left bottom;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* Truncated only by header height. At -45°, vertical projection =
       L × sin(45°) ≈ L × 0.707, so max L = H × √2 ≈ H × 1.4142. */
    max-width: calc(var(--header-h, 150px) * 1.4142);
    font-family: var(--hand);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    color: var(--ink);
    padding: 2px 6px 2px 4px;
    pointer-events: auto;
    cursor: help;
  }

  /* Style: vertical */
  .hs-vertical thead th { height: 130px; vertical-align: bottom; padding: 6px 0; }
  .hs-vertical thead th .label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 120px;
    font-size: 11px;
    padding: 6px 2px;
  }
  .hs-vertical thead th.seq .label { writing-mode: horizontal-tb; transform: none; padding: 8px; max-height: none; }
  .hs-vertical thead th.seq { height: 130px; vertical-align: bottom; }

  /* Newest row highlight */
  tr.newest td { background: var(--accent-soft); }
  tr.newest td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  /* Annotations */
  .anno {
    font-family: var(--hand); color: var(--accent); font-size: 12px;
    line-height: 1.25;
  }

  /* Tooltip on hover for ellipsis */
  th[title] { cursor: help; }

  /* Object-cell glyph: single unicode char shown in the cell, clickable
     to open a FoldoutCell with the underlying object payload. */
  .obj-glyph {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 20px;
    padding: 0 4px;
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    background: var(--paper);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
  }
  .obj-glyph:hover { border-color: var(--ink); background: var(--paper-3); }
  .obj-cell.empty { color: var(--ink-soft); font-family: var(--mono); }

  /* Foldout popover — modal-ish frame anchored near the clicked cell,
     showing either a flat list of values or key-value pairs. */
  .foldout-backdrop {
    position: fixed; inset: 0;
    background: rgba(20, 20, 28, 0.15);
    z-index: 50;
  }
  .foldout {
    position: fixed;
    background: var(--paper);
    border: 1.5px solid var(--stroke);
    border-radius: 6px;
    box-shadow: var(--shadow-pop);
    z-index: 51;
    min-width: 260px;
    max-width: 380px;
    max-height: 60vh;
    display: flex; flex-direction: column;
    font-family: var(--mono);
  }
  .foldout-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 8px;
    background: var(--paper-2);
    border-radius: 6px 6px 0 0;
  }
  .foldout-head .glyph {
    font-size: 14px; line-height: 1;
  }
  .foldout-head .title {
    font-family: var(--hand); font-weight: 700; font-size: 13px;
    color: var(--ink);
  }
  .foldout-head .seq {
    font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
    margin-left: auto;
  }
  .foldout-head .close {
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    background: var(--paper);
    cursor: pointer;
    font-family: var(--mono); font-size: 11px; line-height: 1;
    color: var(--ink-soft);
  }
  .foldout-head .close:hover { background: var(--paper-3); color: var(--ink); }
  .foldout-body {
    flex: 1; overflow-y: auto;
    padding: 6px 0;
  }
  .foldout-body .row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 3px 12px;
    font-size: 11px;
    line-height: 1.3;
  }
  .foldout-body .row:nth-child(even) { background: var(--paper-2); }
  .foldout-body .row .k {
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-soft);
    min-width: 44px;
    text-align: right;
    flex-shrink: 0;
  }
  .foldout-body .row .v {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .foldout-body.list .row .k { min-width: 28px; }
  .foldout-foot {
    padding: 5px 12px 6px;
    border-top: 1px solid var(--line-soft);
    background: var(--paper-2);
    font-family: var(--hand); font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.4px;
    border-radius: 0 0 6px 6px;
  }

  /* Filter-hidden notice — banner above the scrollable table area
     telling the user when filters are suppressing rows. Lives OUTSIDE
     .table-wrap so it never scrolls horizontally with the table. */
  .filter-notice {
    flex-shrink: 0;
    padding: 6px 16px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--accent);
    font-family: var(--hand);
    font-size: 12px;
    color: var(--ink);
    display: flex; align-items: center; gap: 12px;
  }
  .filter-notice .icon {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 6px;
    border: 1px solid var(--stroke);
    border-radius: 10px;
    background: var(--paper);
  }
  .filter-notice .count {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .filter-notice .spacer { flex: 1; }
  .filter-notice .clear {
    cursor: pointer;
    font-family: var(--hand); font-size: 12px;
    color: var(--ink);
    border-bottom: 1px dashed var(--ink);
  }
  .filter-notice .clear:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* Empty state — shown when filters exclude every row. */
  .empty-state {
    padding: 40px 24px;
    text-align: center;
    font-family: var(--hand);
    color: var(--ink-soft);
  }
  .empty-state .glyph {
    font-size: 32px;
    margin-bottom: 6px;
    opacity: 0.6;
  }
  .empty-state .title {
    font-family: var(--hand); font-weight: 700; font-size: 16px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .empty-state .sub {
    font-size: 12px;
    margin-bottom: 12px;
  }
  .empty-state .clear-link {
    cursor: pointer;
    font-family: var(--hand); font-size: 13px;
    color: var(--accent);
    border-bottom: 1px dashed var(--accent);
  }
  .empty-state .clear-link:hover { color: var(--ink); border-bottom-color: var(--ink); }

  /* Bottom hint bar */
  .hintbar {
    border-top: 1px solid var(--line-soft);
    padding: 8px 22px;
    background: var(--paper-2);
    font-family: var(--hand); font-size: 12px;
    color: var(--ink-soft);
    display: flex; align-items: center; gap: 14px;
  }
  .hintbar kbd {
    font-family: var(--mono);
    font-size: 10px;
    padding: 1px 5px;
    border: 1px solid var(--ink-soft);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
  }

  /* ====== Channels tab — Layout C (grouped list + single viewer),
     restyled in the paper/ink wireframe vocabulary ====== */
  .chv-root {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 288px 1fr;
    background: var(--paper);
  }

  /* Left: grouped channel list */
  .chv-list {
    border-right: 1.5px solid var(--stroke);
    background: var(--paper-2);
    overflow-y: auto;
    padding: 16px 0 24px;
    min-width: 0;
  }
  .chv-list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 16px 12px;
  }
  .chv-list-head .ttl { font-family: var(--hand); font-weight: 700; font-size: 19px; }
  .chv-list-head .ct {
    font-family: var(--mono); font-size: 10px; color: var(--ink-soft);
    letter-spacing: 0.5px;
  }
  .chv-group { margin-bottom: 12px; }
  .chv-group-h {
    padding: 6px 16px 4px;
    font-family: var(--hand); font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .chv-item {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .chv-item:hover { background: var(--paper-3); }
  .chv-item.active {
    background: var(--paper);
    border-left-color: var(--accent);
  }
  .chv-item .sw {
    width: 12px; height: 12px;
    border: 1.25px solid var(--stroke);
    border-radius: 2px;
  }
  .chv-item .nm-wrap { min-width: 0; }
  .chv-item .nm {
    font-family: var(--hand); font-size: 14.5px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chv-item.active .nm { font-weight: 700; }
  .chv-item .mt {
    font-family: var(--mono); font-size: 9.5px; color: var(--ink-soft);
    margin-top: 1px;
  }
  .chv-tag {
    font-size: 9px;
    padding: 1px 7px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .chv-tag.live::before { width: 5px; height: 5px; }

  /* Right: single channel viewer */
  .chv-viewer {
    overflow-y: auto;
    padding: 22px 26px 30px;
    min-width: 0;
  }
  .chv-vhead {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .chv-vhead .sw {
    width: 16px; height: 16px;
    border: 1.5px solid var(--stroke);
    border-radius: 3px;
  }
  .chv-vhead h3 {
    font-family: var(--hand); font-weight: 700; font-size: 30px;
    margin: 0; line-height: 1;
  }
  .chv-vhead .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .chv-frame {
    height: 380px;
    border-radius: 5px;
    border-width: 1.5px;
  }
  .chv-cols {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 26px;
    margin-top: 18px;
  }
  .chv-section-h {
    font-family: var(--hand); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .chv-desc {
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    color: var(--ink-2); text-wrap: pretty;
  }
  .chv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chv-actions .btn { font-size: 13px; padding: 5px 10px; }
  .chv-actions .btn.chv-copied {
    background: var(--good);
    border-color: var(--good);
    color: var(--paper);
  }
  .chv-meta-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-family: var(--mono); font-size: 11.5px;
  }
  .chv-meta-grid .k { color: var(--ink-soft); }
  .chv-meta-grid .v { color: var(--ink); }

  /* ====== Night report tab ======
     Faithful to the real RubinTV NightReport component: the report is its
     own set of folder tabs. Each text item is one tab (multiline / keyvalues
     / links); each plot GROUP is one tab showing a 2-up grid of figures
     (image + filename figcaption). One panel shows at a time. A hidden
     'elana' tab is revealed by typing its name, as in the real app. */
  .nr-root {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--paper);
  }
  .nr-head {
    display: flex; align-items: baseline; gap: 14px;
    padding: 18px 26px 0;
  }
  .nr-head h3 { font-family: var(--hand); font-weight: 700; font-size: 27px; margin: 0; line-height: 1; }
  .nr-head .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }

  /* Folder-style sub-tab strip */
  .nr-tabwrap { padding: 16px 26px 0; flex-shrink: 0; }
  .nr-subtabs {
    display: flex; flex-wrap: wrap; gap: 3px;
    align-items: flex-end;
    border-bottom: 1.5px solid var(--stroke);
  }
  .nr-subtab {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 13px 7px;
    font-family: var(--hand); font-size: 13px;
    color: var(--ink-soft);
    background: var(--paper-2);
    border: 1.5px solid var(--stroke); border-bottom: none;
    border-radius: 7px 7px 0 0;
    cursor: pointer;
    position: relative; top: 1.5px;
  }
  .nr-subtab:hover { background: var(--paper-3); }
  .nr-subtab.active {
    background: var(--paper);
    color: var(--ink); font-weight: 700;
    border-bottom: 1.5px solid var(--paper);
    z-index: 1;
  }
  .nr-subtab .kind {
    font-family: var(--mono); font-size: 8px;
    text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--ink-soft);
    border: 1px solid var(--line-soft); border-radius: 6px;
    padding: 0 5px;
  }
  .nr-subtab .pct {
    font-family: var(--mono); font-size: 9px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .nr-subtab.egg { border-style: dashed; }

  /* Content panel */
  .nr-panel {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 20px 26px 30px;
  }

  /* Text panels — key/value rendered as a list (real app uses <ul><li>) */
  .nr-text { max-width: 660px; }
  .nr-text .lead {
    font-family: var(--hand); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: baseline; gap: 8px;
  }
  .nr-text .lead .pill {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.4px;
    border: 1px solid var(--line-soft); border-radius: 6px; padding: 0 5px;
  }
  .nr-kv {
    display: grid; grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-family: var(--mono); font-size: 12.5px;
  }
  .nr-kv .k { color: var(--ink-soft); }
  .nr-kv .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .nr-log {
    margin: 0;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    color: var(--ink-2);
    white-space: pre-wrap;
  }
  .nr-links { display: flex; flex-direction: column; gap: 6px; }
  .nr-link {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 14px;
    border: 1.25px solid var(--stroke); border-radius: 6px;
    background: var(--paper-2);
    cursor: pointer;
  }
  .nr-link:hover { background: var(--paper-3); }
  .nr-link .lk { font-family: var(--hand); font-size: 14px; color: var(--accent); }
  .nr-link .ld { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-left: auto; }
  .nr-link .arr { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }

  /* Plots grid — real app is 2-up, flex-wrap; each .plot is a figure */
  .nr-plot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .nr-plot { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .nr-plot .ph {
    aspect-ratio: 4 / 3; width: 100%;
    border: 1.5px solid var(--stroke); border-radius: 5px;
    flex-direction: column; gap: 5px;
  }
  .nr-plot .ph .stamp {
    font-family: var(--hand); font-size: 11px; color: var(--ink-soft);
  }
  .nr-plot .ph .axes {
    font-family: var(--hand); font-size: 9px; color: var(--ink-soft);
    letter-spacing: 0.3px;
  }
  .nr-plot figcaption {
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    word-break: break-all;
  }
  .nr-eggnote {
    font-family: var(--hand); font-size: 13px; color: var(--ink-soft);
    line-height: 1.5; max-width: 460px;
  }

  /* ============================================================
     RUBINTV — BRAND THEME  (fleshed-out styling)
     Vera C. Rubin Observatory: constellation teal on clean cool
     white, charcoal structure, IBM Plex data + Space Grotesk
     display. Scoped to this file; supersedes the wireframe tokens.
     ============================================================ */
  :root {
    --ink: #23282d;
    --ink-2: #4b525a;
    --ink-soft: #828b93;
    --line: #23282d;
    --line-soft: #e3e8ea;
    --line-mid: #ccd3d7;
    --stroke: #23282d;          /* structural hairlines (charcoal in light) */
    color-scheme: light;

    --paper: #ffffff;
    --paper-2: #f5f8f9;
    --paper-3: #ebeff1;

    --accent: #0a8d93;          /* readable teal — links, focus, selection */
    --accent-bright: #00bbc6;   /* constellation cyan — live, bars, dots */
    --accent-soft: #ddf1f2;     /* selected-row / in-range tint */
    --accent-line: #8ad6da;

    --warn: #d97a2f;
    --good: #1f9d63;

    --hand: 'IBM Plex Sans', system-ui, sans-serif;     /* UI labels */
    --display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;

    --shadow-pop: 0 12px 34px -10px rgba(18,32,38,0.26), 0 3px 10px -3px rgba(18,32,38,0.12);
    --shadow-card: 0 1px 2px rgba(18,32,38,0.05), 0 8px 20px -12px rgba(18,32,38,0.20);
  }

  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  /* Display type on the big titles + section heads */
  .sidebar h1, .title-row h2, .landing-brand, .chv-vhead h3, .nr-head h3,
  .chv-list-head .ttl, .loc-name, .cam-card-name {
    font-family: var(--display); letter-spacing: -0.012em;
  }
  .group-h, .landing-h, .cam-group-h, .chv-group-h, .chv-section-h,
  .picker-head .title, .picker-group .group-title, .dp-nights-list .nhdr,
  .filter-bar > .label { letter-spacing: 0.08em !important; }

  /* Buttons → quiet control border, soft hover, snappy active */
  .btn {
    border: 1px solid var(--line-mid);
    border-radius: 6px;
    background: var(--paper);
    font-weight: 500;
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
  }
  .btn:hover { background: var(--paper-3); border-color: var(--ink-soft); }
  .btn-tab { background: var(--paper-2); }
  .btn-active, .btn.btn-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Tags / pills */
  .tag { border: 1px solid var(--line-mid); border-radius: 999px; font-weight: 500; }
  .tag.live { background: var(--paper-2); border-color: var(--line-mid); }
  .tag.live::before { background: var(--good); }

  /* Cards → hairline + soft shadow + teal lift on hover */
  .loc-card, .cam-card {
    border: 1px solid var(--line-mid);
    box-shadow: var(--shadow-card);
  }
  .loc-card:hover, .cam-card:hover:not(.off) {
    border-color: var(--accent-line); box-shadow: var(--shadow-pop);
  }
  .allsky-frame, .chv-frame { border: 1px solid var(--line-mid); box-shadow: var(--shadow-card); }

  /* Floating surfaces → hairline border (shadow handled by sweep) */
  .date-pop, .picker-pop, .filter-pop, .foldout, .filter-combo .list {
    border: 1px solid var(--line-mid);
  }

  /* Inputs / combobox / selects — quiet by default, teal focus ring */
  .filter-pop select, .filter-pop input, .filter-combo input,
  .dp-foot .input, .dp-two-foot .input, .picker-head input.search,
  .icon-btn, .sidebar-reopen {
    border-color: var(--line-mid);
  }
  .filter-combo input:focus,
  .filter-pop input:focus, .filter-pop select:focus,
  .picker-head input.search:focus, .dp-foot .input:focus, .dp-two-foot .input:focus {
    outline: 2px solid var(--accent-soft); outline-offset: -1px; border-color: var(--accent);
  }

  /* Active controls / filter triggers → teal */
  .filter-btn.active, .cols-btn.active { background: var(--accent-soft); border-color: var(--accent); }
  .filter-btn .count { background: var(--accent-bright); }

  /* Folder sub-tabs inside the night report keep the teal top accent */
  .nr-subtab.active { box-shadow: inset 0 2.5px 0 var(--accent); }

  /* Calendar — selected = teal, today = teal ring */
  .dp-day.selected, .dp-minimap .mm-day.selected {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .dp-day.selected .ct { color: #fff; }
  .dp-day.today { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .dp-minimap .mm-day.has-data::after { background: var(--accent-bright); }

  /* Sidebar nav active — charcoal stays for structure; online dot = cyan */
  .sidebar .cam .dot, .sidebar .cam-pill .pdot,
  .loc-stat .dot, .cam-card-status.on::before { background: var(--accent-bright); }
  .sidebar .view-item.active .vbullet { background: var(--accent); }

  /* Data table — solid hairline grid, crisp sticky header */
  .data-table thead th { letter-spacing: 0.01em; background: var(--paper-2); }
  .data-table th.seq, .data-table td.seq { background: var(--paper-2); }
  tr.newest td { background: var(--accent-soft); }

  /* Night-report plot placeholders + all-sky frame stay neutral on white */
  .nr-plot .ph, .allsky-ph { background-color: var(--paper-2); }

  /* Live status pill text */
  .status-pill .clock-time { color: var(--ink); }


  /* ============================================================
     DARK THEME + theme selector
     ============================================================ */
  [data-theme="dark"] {
    --ink: #e8edef;
    --ink-2: #aeb7bd;
    --ink-soft: #808a91;
    --line: #e8edef;

function ThemeToggle({ vertical }) {
  const [mode, setMode] = useState(() => {

  });
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const resolved = mode === 'system' ? (mq.matches ? 'dark' : 'light') : mode;
      document.documentElement.setAttribute('data-theme', resolved);
    };
    apply();
    try { localStorage.setItem('rubintv-theme', mode); } catch (e) {}

function LiveStatusPill() {
  // Drift forward from a fixed baseline so the prototype shows a
  // believable wall time + a recently-arrived image, independent of the
  // viewer's clock.
  const baseUtc = useMemo(() => {
    // 2026-05-01 14:01:23 UTC — matches the date pinned in the table.
    return Date.UTC(2026, 4, 1, 14, 1, 23) - performance.now();
  }, []);
  // Last image landed 3 minutes 48 seconds before the wall time at mount.
  const lastImgAt = useMemo(() => baseUtc - (3 * 60 + 48) * 1000, [baseUtc]);

  const [now, setNow] = useState(() => baseUtc + performance.now());
  useEffect(() => {
    const id = setInterval(() => setNow(baseUtc + performance.now()), 1000);
    return () => clearInterval(id);
  }, [baseUtc]);

  const utc = new Date(now);
  const pad = (n) => String(n).padStart(2, '0');
  const utcStr = `${pad(utc.getUTCHours())}:${pad(utc.getUTCMinutes())}:${pad(utc.getUTCSeconds())}`;

  const sinceMs = Math.max(0, now - lastImgAt);
  const sinceS = Math.floor(sinceMs / 1000);
  const sinceStr = `${pad(Math.floor(sinceS / 3600))}:${pad(Math.floor(sinceS % 3600 / 60))}:${pad(sinceS % 60)}`;

  return (
    <span className="tag live status-pill">
      <span className="clocks">
        <span className="clock-label">UTC</span>
        <span className="clock-time">{utcStr}</span>
        <span className="clock-label">since img</span>
        <span className="clock-time">{sinceStr}</span>
      </span>
    </span>);

}

/* ---------- Date picker ----------
   Click the [📅 YYYY-MM-DD] btn-tab to open a popover. The popover style
   is exposed as a tweak so we can compare three directions side-by-side:

     classic  — month grid only, prev/next, today shortcut
     presets  — month grid + sidebar of observing-night shortcuts (last
                night, last 7, current run, custom range)
     nights   — vertical list of recent observing nights with per-night
                metadata (image count + hourly volume bars + weather) and
                a small month mini-map on the right for jumping around

   Reference "today" is pinned to 2026-05-01 to match the table. */

const REF_TODAY = { y: 2026, m: 4, d: 1 }; // m is 0-indexed (4 = May)

// Deterministic per-day metadata: which days had observing, image count,
// weather notes, hourly volume profile. Seeded so the design is stable.
function buildDayInfo() {
  let s = 0xb16b00b5;
  const rand = () => {s = Math.imul(s, 1664525) + 1013904223 >>> 0;return s / 0x100000000;};
  const info = {};
  // Populate 6 months around the reference.
  for (let mo = -2; mo <= 1; mo++) {
    const d0 = new Date(Date.UTC(REF_TODAY.y, REF_TODAY.m + mo, 1));
    const daysInMonth = new Date(Date.UTC(REF_TODAY.y, REF_TODAY.m + mo + 1, 0)).getUTCDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d));
      const key = `${date.getUTCFullYear()}-${pad2(date.getUTCMonth() + 1)}-${pad2(d)}`;
      // 60% observing chance, dampened if weather bad
      const weatherBad = rand() < 0.18;
      const observed = !weatherBad && rand() < 0.78;
      if (!observed) {
        info[key] = { observed: false, weatherBad, count: 0 };
        continue;
      }
      const heavy = rand() < 0.3;
      const count = heavy ? Math.floor(700 + rand() * 400) : Math.floor(200 + rand() * 400);
      // 10 hourly buckets (typical night, sundown→sunrise minus twilight)
      const bars = Array.from({ length: 10 }, () => Math.floor(2 + rand() * 14));
      info[key] = { observed: true, weatherBad: false, count, heavy, bars };
    }
  }
  // Pin the reference day to a realistic value
  info['2026-05-01'] = { observed: true, weatherBad: false, count: 786, heavy: true, bars: [4, 11, 13, 14, 12, 10, 13, 11, 8, 5] };
  return info;
}
const pad2 = (n) => String(n).padStart(2, '0');
const fmtKey = ({ y, m, d }) => `${y}-${pad2(m + 1)}-${pad2(d)}`;
const fmtKeyDate = (date) => `${date.getUTCFullYear()}-${pad2(date.getUTCMonth() + 1)}-${pad2(date.getUTCDate())}`;
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

/* Reusable month grid. Shows leading/trailing days from prev/next month
   dimmed; today is outlined; selected is filled ink. Days with observing
   data display the night's MAX SEQ NUM (image count) beneath the date,
   per teammate feedback — a number is far more informative than a dot.
   `showArrows` lets the two-month layout suppress arrows on the right
   grid so navigation is unambiguous. `showFoot` is currently unused in
   the two-month layout (the shared foot lives outside MonthGrid). */
function MonthGrid({ view, setView, selected, setSelected, dayInfo, showFoot, showArrows = true, monthOffset = 0, onPick }) {
  // Resolve the actual month to render from view + offset.
  const baseDate = new Date(Date.UTC(view.y, view.m + monthOffset, 1));
  const y = baseDate.getUTCFullYear();
  const m = baseDate.getUTCMonth();
  const firstDow = baseDate.getUTCDay();
  const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const daysInPrev = new Date(Date.UTC(y, m, 0)).getUTCDate();

  // Build 6 weeks × 7 days = 42 cells
  const cells = [];
  for (let i = 0; i < firstDow; i++) {
    const d = daysInPrev - firstDow + 1 + i;
    cells.push({ d, mOff: -1, key: fmtKey({ y: m === 0 ? y - 1 : y, m: (m + 11) % 12, d }) });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ d, mOff: 0, key: fmtKey({ y, m, d }) });
  }
  let nextD = 1;
  while (cells.length < 42) {
    cells.push({ d: nextD, mOff: 1, key: fmtKey({ y: m === 11 ? y + 1 : y, m: (m + 1) % 12, d: nextD }) });
    nextD++;
  }

  const todayKey = fmtKey(REF_TODAY);
  const selKey = fmtKey(selected);

  // Stepping always moves the underlying `view`, regardless of which
  // sub-grid the user clicked the arrow on.
  const stepMonth = (n) => {
    const nm = view.m + n;
    setView({ y: view.y + Math.floor(nm / 12), m: (nm % 12 + 12) % 12 });
  };

  return (
    <div className="dp-month">
      <div className="dp-mhead">
        <div>
          <span className="month">{MONTH_NAMES[m]}</span>
          <span className="yr">{y}</span>
        </div>
        {showArrows &&
        <div className="arrs">
            <button className="arr" onClick={() => stepMonth(-12)} title="Previous year">«</button>
            <button className="arr" onClick={() => stepMonth(-1)} title="Previous month">‹</button>
            <button className="arr" onClick={() => stepMonth(1)} title="Next month">›</button>
            <button className="arr" onClick={() => stepMonth(12)} title="Next year">»</button>
          </div>
        }
      </div>

      <div className="dp-grid">
        {DOW.map((d) => <div key={d} className="dow">{d}</div>)}
        {cells.map((c, i) => {
          const info = dayInfo[c.key];
          const isOut = c.mOff !== 0;
          const isFuture = c.key > todayKey;
          const classes = ['dp-day'];
          if (isOut) classes.push('out');
          if (isFuture && !isOut) classes.push('disabled');
          if (info?.observed) classes.push('has-data');
          if (info?.heavy) classes.push('heavy');
          // 'today' outline only on the in-month cell — otherwise the same
          // date shows two outlines (in-month + leading/trailing) when two
          // months are displayed side by side.
          if (c.key === todayKey && !isOut) classes.push('today');
          if (c.key === selKey && !isOut) classes.push('selected');
          // Bottom-row content: max seq num for observed nights. Out-of-month
          // and future days never show a count; weathered-out nights are
          // indistinguishable from no-observing nights here — both render
          // as 'no count', per teammate feedback that there's no separate
          // 'weathered out' display state.
          const ctText = !isFuture && !isOut && info?.observed ? info.count : '';
          return (
            <div
              key={i}
              className={classes.join(' ')}
              title={isOut ? '' : info?.observed ? `${c.key} · ${info.count} images` : c.key}
              onClick={() => {
                if (isOut || isFuture) return;
                onPick({ y, m, d: c.d });
              }}>
              <span className="num">{c.d}</span>
              {ctText !== '' && <span className="ct">{ctText}</span>}
            </div>);

        })}
      </div>

      {showFoot &&
      <div className="dp-foot">
          <input className="input" value={fmtKey(selected)} readOnly />
          <span className="today-link" onClick={() => {setSelected(REF_TODAY);setView({ y: REF_TODAY.y, m: REF_TODAY.m });}}>jump to today</span>
        </div>
      }
    </div>);

}

function NightsPanel({ dayInfo, selected, setSelected, view, setView, onPick }) {

  const nights = useMemo(() => {
    const out = [];

    for (let i = 0; i < 90 && out.length < 30; i++) {

      if (info?.observed) {
        out.push({
          key: k,
          y: d.getUTCFullYear(), m: d.getUTCMonth(), day: d.getUTCDate(),
          dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()],
          count: info.count, heavy: info.heavy, bars: info.bars
        });
      } else if (info?.weatherBad) {
        out.push({ key: k, y: d.getUTCFullYear(), m: d.getUTCMonth(), day: d.getUTCDate(),
          dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()],
          count: 0, weatherBad: true });
      }
      d = new Date(d.getTime() - 86400000);
    }
    return out;
  }, [dayInfo]);

  const selKey = fmtKey(selected);

  return (
    <div className="dp-nights-wrap">
      <div className="dp-nights-list">
        <div className="nhdr">Recent observing nights · {nights.filter((n) => !n.weatherBad).length}</div>
        {nights.map((n) =>
        <div
          key={n.key}
          className={`night-row ${n.key === selKey ? 'selected' : ''}`}
          onClick={() => onPick({ y: n.y, m: n.m, d: n.day })}
          title={n.key}>
          
            <div>
              <div className="ndate">{n.key.slice(5)}</div>
              <div className="ndow">{n.dow}</div>
            </div>
            <div className="nmid">
              <span className="nlabel">
                {n.weatherBad ? 'weathered out' : n.heavy ? 'long night' : 'standard night'}
              </span>
              {!n.weatherBad ?
            <span className="nmeta">
                  <span className="nbars">
                    {n.bars.map((h, i) =>
                <span key={i} style={{ height: `${Math.max(2, h)}px` }} />
                )}
                  </span>
                </span> :

            <span className="nmeta"><span className="bad">dome closed · humidity 92%</span></span>
            }
            </div>
            <div className="ncount">
              {n.weatherBad ? '—' : n.count}
              <span className="imgs">{n.weatherBad ? '' : 'images'}</span>
            </div>
          </div>
        )}
      </div>
      <div className="dp-minimap">
        <MiniMap view={view} setView={setView} selected={selected} setSelected={setSelected} dayInfo={dayInfo} onPick={onPick} />
      </div>
    </div>);

}

function MiniMap({ view, setView, selected, setSelected, dayInfo, onPick }) {
  const { y, m } = view;
  const firstDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
  const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const todayKey = fmtKey(REF_TODAY);
  const selKey = fmtKey(selected);
  const stepMonth = (n) => {
    const nm = m + n;
    setView({ y: y + Math.floor(nm / 12), m: (nm % 12 + 12) % 12 });
  };

  return (
    <>
      <div className="mm-head">
        <span className="mm-month">{MONTH_NAMES[m].slice(0, 3)} {y}</span>
        <span>
          <button className="arr" style={{ width: 18, height: 18, fontSize: 10 }} onClick={() => stepMonth(-1)}>‹</button>
          <button className="arr" style={{ width: 18, height: 18, fontSize: 10, marginLeft: 2 }} onClick={() => stepMonth(1)}>›</button>
        </span>
      </div>
      <div className="mm-grid">
        {DOW.map((d) => <div key={d} style={{ fontFamily: 'var(--mono)', fontSize: 8, color: 'var(--ink-soft)', textAlign: 'center' }}>{d[0]}</div>)}
        {cells.map((d, i) => {
          if (d == null) return <div key={i} />;
          const k = fmtKey({ y, m, d });
          const info = dayInfo[k];
          const isFuture = k > todayKey;
          const classes = ['mm-day'];
          if (info?.observed) classes.push('has-data');
          if (k === selKey) classes.push('selected');
          if (isFuture) classes.push('out');
          return (
            <div key={i} className={classes.join(' ')} onClick={() => {if (!isFuture) onPick({ y, m, d });}} title={k}>{d}</div>);

        })}
      </div>
      <div className="mm-legend">
        Dot · observing night<br />
        Selected highlights in list at left.
      </div>
    </>);

}
